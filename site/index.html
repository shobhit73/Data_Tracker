/* Group reports under their category heading.

   Sorting by sort_order alone is not enough: Garnishment is category 'Payroll'
   but sits last in the catalogue, which printed the "Payroll" heading twice.
   Categories keep the order of their first appearance; reports keep theirs. */
function groupByCategory(reports){
  const order = [], byCat = {};
  reports.slice().sort((a, b) => a.cat.sort_order - b.cat.sort_order).forEach(r => {
    if(!byCat[r.cat.category]){ byCat[r.cat.category] = []; order.push(r.cat.category); }
    byCat[r.cat.category].push(r);
  });
  return order.map(c => [c, byCat[c]]);
}

function reportRow(r, withPendingAttr){
  const pending = r.units.some(u => u.status !== 'Received');
  return '<div class="hist-row"' + (withPendingAttr ? ' data-pending="' + (pending ? '1' : '0') + '"' : '') + '>' +
    '<div class="hist-row__name">' + esc(r.cat.report_name) +
      (r.cat.in_reference_doc ? '' :
        '<span class="doc-flag" title="Tracked here but not yet listed in the reference document">not in doc</span>') +
      (r.cat.year_range ? '<div class="hist-row__range">' + esc(r.cat.year_range) + '</div>' : '') +
    '</div>' +
    '<div class="hist-row__units">' + r.units.map(unitPill).join('') + '</div>' +
  '</div>';
}

function unitPill(u){
  const cls = u.status === 'Received' ? 'yes' : (u.status === 'Not applicable' ? 'na' : 'no');
  const mark = u.status === 'Received' ? '✓' : (u.status === 'Not applicable' ? '–' : '✗');
  const label = u.unit_label === 'Report' ? mark : u.unit_label + ' ' + mark;
  const title = [
    u.status,
    u.file_name ? 'file: ' + u.file_name : null,
    u.checked_date ? 'checked ' + u.checked_date : null,
    u.notes || null,
    u.folder_url ? 'click to open the Drive folder' : null
  ].filter(Boolean).join(' · ');

  // A received report links to the folder its file sits in, so the number can
  // be checked against the actual Drive contents rather than taken on trust.
  if(u.folder_url && u.status === 'Received'){
    return '<a class="unit-pill unit-pill--' + cls + ' unit-pill--link" target="_blank" rel="noopener"' +
      ' href="' + esc(u.folder_url) + '" title="' + esc(title) + '">' + esc(label) + '</a>';
  }
  return '<span class="unit-pill unit-pill--' + cls + '" title="' + esc(title) + '">' +
    esc(label) + '</span>';
}

/* Whether the previous platform can still be logged into, from the team's
   access spreadsheet (client_platform_access).

   This is what makes a 'Pending' row readable. Pending against "Has access"
   is work outstanding; Pending against "Access lost" is data that is simply
   gone, and chasing it is wasted effort. The two look identical without this.

   'usable' drives sorting and filtering: false means no download is possible
   today, whatever the file counts say. Unknown is deliberately not usable-false
   — the sheet not mentioning a client is an absence of evidence, and 7 of the
   clients currently tracked are absent from it. */
const ACCESS = {
  'Has access':             { sev: 'success', usable: true,  short: 'Access OK' },
  'Blocked on OTP':         { sev: 'warning', usable: false, short: 'OTP blocked' },
  'Credentials not working': { sev: 'warning', usable: false, short: 'Creds failing' },
  'No credentials':         { sev: 'warning', usable: false, short: 'No creds' },
  'Access lost':            { sev: 'error',   usable: false, short: 'Access lost' },
  'Exited from Amazon':     { sev: 'error',   usable: false, short: 'Exited Amazon' },
  'Not started':            { sev: 'neutral', usable: true,  short: 'Not started' },
  'Unknown':                { sev: 'neutral', usable: true,  short: 'Access unknown' }
};
const ACCESS_UNRECORDED = { sev: 'neutral', usable: true, short: 'Access not checked' };

function accessOf(code){
  const row = (DATA.access || {})[code];
  const meta = row ? (ACCESS[row.access_status] || ACCESS.Unknown) : ACCESS_UNRECORDED;
  return { row: row, status: row ? row.access_status : 'Not checked',
           sev: meta.sev, usable: meta.usable, short: meta.short };
}

function accessChip(code){
  const a = accessOf(code);
  const title = a.row
    ? a.status + (a.row.checked_on ? ' · checked ' + a.row.checked_on : '') +
      (a.row.fdqot_in_file ? ' · FDQOT: ' + a.row.fdqot_in_file : '')
    : 'This client is not listed in the access spreadsheet.';
  return '<span class="uzio-status uzio-status--' + a.sev + '" title="' + esc(title) + '">' +
    esc(a.short) + '</span>';
}

/* Two sentences the file counts cannot say on their own.

   The first is how much of the outstanding work is not actually doable, so a
   large "still pending" number is not read as a backlog when part of it is
   unreachable. The second is the reverse and is easy to miss entirely: the
   90-day window is a stand-in for "can we still log in", and where the access
   sheet says yes but the window has closed, the stand-in is wrong and real
   collectable data is sitting outside the list. */
function accessSummary(scope, byClient){
  const outstanding = (code) => Object.values(byClient[code] || {})
    .reduce((n, r) => n + r.units.filter(u => u.status !== 'Received').length, 0);

  const blocked = scope.filter(sc => !accessOf(sc.dsp_short_code).usable);
  const blockedFiles = blocked.reduce((n, sc) => n + outstanding(sc.dsp_short_code), 0);

  const tracked = {};
  scope.forEach(sc => { tracked[sc.dsp_short_code] = true; });
  const excluded = DATA.accessExcluded || {};
  const reachableOutside = (DATA.clients || []).filter(c => {
    const a = (DATA.access || {})[c.dsp_short_code];
    return a && a.access_status === 'Has access' &&
           !tracked[c.dsp_short_code] && !excluded[c.dsp_short_code];
  });

  let out = '';
  if(blocked.length) out +=
    ' <b>' + blocked.length + '</b> of them cannot be logged into' +
    (blockedFiles ? ', which accounts for <b>' + blockedFiles + '</b> of the files still outstanding' : '') +
    ' — that work is not pending, it is gone.';
  if(reachableOutside.length) out +=
    ' Separately, <b>' + reachableOutside.length + '</b> clients the access sheet says we can still log' +
    ' into are not tracked here at all, their last API run being older than the 90-day window (' +
    reachableOutside.map(c => esc(c.dsp_name)).join(', ') + ').';
  return out;
}

function renderHistorical(){
  const el = panel('historical-content');
  const scope = DATA.histScope || [];
  const catalog = DATA.histCatalog || [];
  const status = DATA.histStatus || [];

  if(!scope.length){
    el.innerHTML = emptyNote('No DSP is currently in the historical-data window.');
    return;
  }

  const catById = {};
  catalog.forEach(c => { catById[c.id] = c; });

  // status rows -> per client, per report, ordered by the catalogue's own order
  const byClient = {};
  status.forEach(s => {
    const c = catById[s.report_id];
    if(!c) return;
    const client = (byClient[s.dsp_short_code] = byClient[s.dsp_short_code] || {});
    const rep = (client[s.report_id] = client[s.report_id] || { cat: c, units: [] });
    rep.units.push(s);
  });

  const cards = scope.map(sc => {
    const name = (sc.client_overview && sc.client_overview.dsp_name) || sc.dsp_short_code;
    const reports = Object.values(byClient[sc.dsp_short_code] || {});
    reports.forEach(r => r.units.sort((a, b) => a.unit_label.localeCompare(b.unit_label)));
    reports.sort((a, b) => a.cat.sort_order - b.cat.sort_order);

    const all = reports.reduce((n, r) => n + r.units.length, 0);
    const got = reports.reduce((n, r) => n + r.units.filter(u => u.status === 'Received').length, 0);
    const pct = all ? got / all * 100 : 0;
    const state = got === all && all ? 'complete' : (got ? 'partial' : 'none');
    const fill = state === 'complete' ? '' :
      (pct >= 50 ? ' uzio-progress__fill--warn' : ' uzio-progress__fill--error');
    const badge = state === 'complete' ? 'success' : (pct >= 50 ? 'warning' : 'error');

    const body = groupByCategory(reports).map(([cat, reps]) =>
      '<div class="hist-cat">' + esc(cat) + '</div>' +
      reps.map(r => reportRow(r, true)).join('')
    ).join('');

    // A div with a button role rather than a real <button>: the progress bar
    // needs block-level children, which a button's content model does not allow
    // — as a <span> it stayed inline and its height was ignored, so the bar
    // never drew at all.
    const acc = accessOf(sc.dsp_short_code);
    return '<div class="hist-client" data-name="' + esc(name.toLowerCase()) + '"' +
      ' data-vendor="' + esc(sc.vendor) + '" data-state="' + state + '"' +
      ' data-access="' + (acc.usable ? 'usable' : 'blocked') + '">' +
      '<div class="hist-head" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="hist-head__caret">▶</span>' +
        '<span class="hist-head__name" title="' + esc(name) + '">' + esc(name) + '</span>' +
        '<span class="uzio-chip">' + esc(sc.vendor) + '</span>' +
        accessChip(sc.dsp_short_code) +
        '<span class="hist-head__meta">in scope since ' + esc(sc.entered_on) +
          (sc.folder_url
            ? ' &middot; <a class="hist-head__drive" target="_blank" rel="noopener"' +
              ' href="' + esc(sc.folder_url) + '">Drive</a>'
            : '') + '</span>' +
        '<div class="uzio-progress hist-head__bar">' +
          '<div class="uzio-progress__fill' + fill + '" style="width:' + pct + '%"></div>' +
        '</div>' +
        '<span class="uzio-status uzio-status--' + badge + '">' + got + ' / ' + all + ' files</span>' +
      '</div>' +
      '<div class="hist-body">' + body + '</div>' +
    '</div>';
  }).join('');

  const totalFiles = status.length;
  const gotFiles = status.filter(s => s.status === 'Received').length;

  el.innerHTML =
    /* These reports are pulled by the ADP/Paycom bots, so the place their
       behaviour is documented belongs next to the coverage they produce —
       otherwise "why did this not arrive" starts with hunting for the runbook. */
    '<div class="bots-bar"><span>Reports are pulled by our automation bots —</span>' +
    '<a href="https://drive.google.com/drive/folders/16eSRLwiT3apJS8crOdRJgkuatJNRWWHM" ' +
    'target="_blank" rel="noopener">ADP &amp; Paycom bot docs &#8599;</a>' +
    '<span>(Historical Data Bot &middot; Daily Reports Automation)</span></div>' +
    buildFilters(HIST_FILTERS) +
    '<p style="font-size:12px;color:var(--uzio-color-text-muted);margin:0 0 12px">' +
    gotFiles + ' of ' + totalFiles + ' expected files received across ' + scope.length + ' clients. ' +
    'Payroll History is counted per year and Audit Trail per quarter.' +
    accessSummary(scope, byClient) + '</p>' +
    cards;

  // accordion — the header is a div playing the part of a button, so Enter and
  // Space have to be handled here; a real button would do it for free.
  const toggle = (h) => {
    const open = h.closest('.hist-client').classList.toggle('is-open');
    h.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  el.querySelectorAll('.hist-head').forEach(h => {
    h.addEventListener('click', e => {
      // The Drive link lives inside the toggle — following it should not also
      // expand the card underneath.
      if(e.target.closest('a')) return;
      toggle(h);
    });
    h.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(h); }
    });
  });

  const records = Array.from(el.querySelectorAll('.hist-client')).map(c => ({
    el: c, name: c.dataset.name, vendor: c.dataset.vendor, state: c.dataset.state,
    access: c.dataset.access
  }));
  wireFilters(el, HIST_FILTERS, records, (r, s) =>
    (!s.q || r.name.indexOf(s.q) !== -1) &&
    (s.histState === 'all' || r.state === s.histState) &&
    (s.histVendor === 'all' || r.vendor === s.histVendor) &&
    (s.histAccess === 'all' || r.access === s.histAccess),
    (n, total) => n + ' of ' + total + ' clients'
  );

  // The pending-only toggle hides satisfied report rows inside every card, and
  // opens the cards so the remaining work is visible without extra clicks.
  el.querySelector('#histPendingOnly').addEventListener('change', e => {
    const on = e.target.checked;
    el.querySelectorAll('.hist-row').forEach(row => {
      row.style.display = (on && row.dataset.pending === '0') ? 'none' : '';
    });
    el.querySelectorAll('.hist-client').forEach(c => {
      c.classList.toggle('is-open', on);
      c.querySelector('.hist-head').setAttribute('aria-expanded', on ? 'true' : 'false');
    });
  });
}

/* Without this you have to go hunting through Drive for the client folder
   before you can check anything the card claims. Two of the fourteen genuinely
   have no Audit Files folder — that is what their note already says, so the
   absence is stated rather than left as a missing link. */
function auditFolderLink(recs){
  const url = (recs.find(r => r.audit_folder_url) || {}).audit_folder_url;
  if(!url) return '<div class="audit-card__link audit-card__link--none">No Audit Files folder</div>';
  return '<div class="audit-card__link"><a href="' + esc(url) + '" target="_blank" ' +
    'rel="noopener">Audit Files &#8599;</a></div>';
}

function renderAudit(rows){
  const el = panel('audit-content');
  const byClient = {}; const order = [];
  rows.forEach(r => {
    if(!byClient[r.client_name]){ byClient[r.client_name] = []; order.push(r.client_name); }
    byClient[r.client_name].push(r);
  });

  const scored = order.map(client => {
    const recs = byClient[client];
    const overallOnly = recs.length === 1 && recs[0].audit_category === 'Overall';
    const present = recs.filter(r => r.status === 'Present');
    return { client, recs, overallOnly, present: present.length, total: overallOnly ? 0 : recs.length };
  });
  scored.sort((a, b) => {
    if(a.overallOnly !== b.overallOnly) return a.overallOnly ? 1 : -1;
    return (b.present / (b.total || 1)) - (a.present / (a.total || 1));
  });

  const cards = scored.map(s => {
    const censusMissing = s.recs.some(r => r.audit_category === 'Census' && r.status !== 'Present');
    const attrs = ' data-name="' + esc((s.client || '').toLowerCase()) + '"' +
      ' data-cover="' + (s.overallOnly ? 'none' : (s.present === s.total ? 'full' : 'gap')) + '"' +
      ' data-census="' + (censusMissing ? '1' : '0') + '"';
    if(s.overallOnly){
      const r = s.recs[0];
      return '<div class="audit-card"' + attrs + '><div class="audit-card__head"><b>' + esc(s.client) + '</b>' +
        '<span class="uzio-status uzio-status--neutral">' + esc(r.status) + '</span></div>' +
        '<div class="uzio-progress"><div class="uzio-progress__fill" style="width:0%"></div></div>' +
        // These cards need the link most: they are the ones where somebody has
        // to go and look at whether the folder is really empty.
        auditFolderLink(s.recs) +
        (r.notes ? '<div class="audit-card__note">' + esc(r.notes) + '</div>' : '') + '</div>';
    }
    const pct = s.total ? (s.present / s.total * 100) : 0;
    const fill = pct === 100 ? '' : (pct >= 50 ? ' uzio-progress__fill--warn' : ' uzio-progress__fill--error');
    const badge = pct === 100 ? 'success' : (pct >= 50 ? 'warning' : 'error');
    const pips = s.recs.map(r =>
      '<span class="cat-pip cat-pip--' + (r.status === 'Present' ? 'yes' : 'no') + '">' + esc(r.audit_category) + '</span>'
    ).join('');
    const notes = s.recs.filter(r => r.notes).map(r => r.audit_category + ' — ' + r.notes);
    return '<div class="audit-card"' + attrs + '><div class="audit-card__head"><b>' + esc(s.client) + '</b>' +
      '<span class="uzio-status uzio-status--' + badge + '">' + s.present + ' / ' + s.total + '</span></div>' +
      '<div class="uzio-progress"><div class="uzio-progress__fill' + fill + '" style="width:' + pct + '%"></div></div>' +
      '<div class="audit-card__cats">' + pips + '</div>' +
      auditFolderLink(s.recs) +
      (notes.length ? '<div class="audit-card__note">' + esc(notes.join(' · ')) + '</div>' : '') + '</div>';
  }).join('');

  el.innerHTML =
    buildFilters(AUDIT_FILTERS) +
    '<div class="audit-grid">' + cards + '</div>';

  const records = Array.from(el.querySelectorAll('.audit-card')).map(c => ({
    el: c, name: c.dataset.name, cover: c.dataset.cover, censusMissing: c.dataset.census === '1'
  }));
  wireFilters(el, AUDIT_FILTERS, records, (r, s) =>
    (!s.q || r.name.indexOf(s.q) !== -1) &&
    (s.audCover === 'all' || r.cover === s.audCover) &&
    (!s.audCensus || r.censusMissing),
    (n, total) => n + ' of ' + total + ' clients'
  );
}

/* ==================== DOCUMENT TRANSFER ==================== */
const DOC_STATUS_CLASS = {
  'Complete': 'success',
  'Completed with issues': 'warning',
  'In progress': 'warning',
  'Blocked': 'error',
  'Nothing to transfer': 'neutral'
};
function num(n){ return n == null ? NIL : '<span class="tnum">' + Number(n).toLocaleString() + '</span>'; }
const DOC_FILTERS = {
  search: { id: 'docSearch', placeholder: 'Search client…' },
  groups: [
    // Filters on what prod holds, not on what the mail claimed: the mail
    // status is shown in the table but it is not the thing to act on.
    { id: 'docStatus', options: [
      { val: 'all', label: 'Any coverage' },
      { val: 'full', label: '95%+', dot: DOT.good },
      { val: 'most', label: '50–94%', dot: DOT.warn },
      { val: 'low', label: 'Under 50%', dot: DOT.bad },
      { val: 'none', label: 'No documents', dot: DOT.bad },
      { val: 'nodata', label: 'No prod match' }
    ]}
  ],
  toggles: [{ id: 'docFailed', label: 'Has failed docs' }],
  countId: 'docCount'
};
/* Every client, ordered by what prod actually holds, with the transfer mail
   alongside as a second opinion.

   This used to be exactly the 20 clients someone had mailed about, which made
   it a record of announcements rather than of documents. The mails give no
   count at all for InnovDel, JDW or Skyland, one reported Success=0 and
   corrected itself minutes later, and none of them can say what is in the
   system today rather than what was uploaded that morning. A client nobody
   mailed about simply did not appear — which is how Goro (1,814 employees) and
   Secure Transit (1,709) sat at zero documents without surfacing anywhere.

   So the number comes from prod (client_document_counts, counted off the
   `form` table) and the mail sits next to it, not in place of it. Where the
   two disagree, the disagreement is the point. */
function renderDocuments(rows){
  const el = panel('documents-content');
  const byStatus = (s) => rows.filter(r => r.status === s).length;

  // Attach each mail to its client. A mail matching nothing is still shown
  // rather than dropped, so nothing disappears silently in the merge.
  const claimed = {};
  const merged = (DATA.clients || []).map(c => {
    const mail = rows.find(r => sameClient(r.client_name, c.dsp_name));
    if(mail) claimed[mail.id] = true;
    return { name: c.dsp_name, mail: mail || null,
             counts: (DATA.docCounts || {})[c.dsp_short_code] || null };
  }).concat(rows.filter(r => !claimed[r.id])
                .map(m => ({ name: m.client_name, mail: m, counts: null })));

  // Documents descending: the page answers "who has how much", so a client at
  // zero with a thousand employees belongs where the numbers run out rather
  // than buried alphabetically. No prod match sorts last — that is a different
  // state from zero, not a smaller one.
  merged.sort((a, b) => {
    const ad = a.counts ? a.counts.documents : -1, bd = b.counts ? b.counts.documents : -1;
    return bd - ad || a.name.localeCompare(b.name);
  });

  const body = merged.map(m => {
    const r = m.mail, d = m.counts;
    const breakdown = [];
    if(r){
      if(r.fail_filename_format) breakdown.push('filename ' + r.fail_filename_format);
      if(r.fail_employee_not_found) breakdown.push('no EE ' + r.fail_employee_not_found);
      if(r.fail_unsupported_type) breakdown.push('bad type ' + r.fail_unsupported_type);
      if(r.employees_skipped) breakdown.push(Number(r.employees_skipped).toLocaleString() + ' employees skipped');
    }
    const links = [];
    if(r && r.jira_id) links.push('<a href="https://jira.uzio.com/browse/' + esc(r.jira_id) +
      '" target="_blank" rel="noopener">' + esc(r.jira_id) + '</a>');
    if(r && r.drive_folder_url) links.push('<a href="' + esc(r.drive_folder_url) +
      '" target="_blank" rel="noopener">Drive</a>');

    /* Buckets are judged on prod, not on the mail: that is the state someone
       can act on. "No prod match" is its own bucket so it cannot be mistaken
       for a client that genuinely has nothing.

       The denominator is every employee, not just the active ones. Documents
       load for leavers too — Falcon has 705 of 711 covered against 24 active
       staff — so measuring against active headcount produces percentages like
       2,938% and tells you nothing. Nobody reaches a true 100%, so 95% is
       treated as done. */
    const pct = d && d.total_employees
      ? Math.round(d.employees_with_docs / d.total_employees * 100) : 0;
    let bucket, label;
    if(!d){ bucket = 'nodata'; label = 'No prod match'; }
    else if(d.documents === 0){ bucket = 'none'; label = 'None'; }
    else if(pct >= 95){ bucket = 'full'; label = pct + '% covered'; }
    else if(pct >= 50){ bucket = 'most'; label = pct + '% covered'; }
    else { bucket = 'low'; label = pct + '% covered'; }
    const sev = { none: 'error', low: 'error', most: 'warning', full: 'success',
                  nodata: 'neutral' }[bucket];

    const docCell = d
      ? '<b>' + Number(d.documents).toLocaleString() + '</b>' +
        '<div class="sub">' + Number(d.employees_with_docs).toLocaleString() + ' of ' +
        Number(d.total_employees).toLocaleString() + ' employees</div>'
      : NIL;

    // The mail's own figure earns its column only where it disagrees with the
    // count, or where there is no count to compare it against.
    const reported = r && r.total_docs != null
      ? (d && Number(r.total_docs) !== Number(d.documents)
          ? '<span class="doc-mismatch" title="The transfer mail reported a different number">' +
            num(r.total_docs) + '</span>'
          : num(r.total_docs))
      : NIL;

    return '<tr data-name="' + esc((m.name || '').toLowerCase()) + '"' +
      ' data-bucket="' + bucket + '" data-failed="' + (r && r.failed_docs ? '1' : '0') + '">' +
      '<td class="name-cell"><b title="' + esc(m.name) + '">' + esc(m.name) + '</b>' +
        (links.length ? '<div class="sub">' + links.join(' &middot; ') + '</div>' : '') + '</td>' +
      '<td><span class="uzio-status uzio-status--' + sev + '">' + label + '</span></td>' +
      '<td class="tnum">' + docCell + '</td>' +
      '<td>' + (r
        ? '<span class="uzio-status uzio-status--' + (DOC_STATUS_CLASS[r.status] || 'neutral') + '">' +
          esc(r.status) + '</span><div class="sub">' + fmtDate(r.transfer_date) + '</div>'
        : '<span class="sub">no transfer mail</span>') + '</td>' +
      '<td class="tnum">' + reported + '</td>' +
      '<td class="tnum">' + (r && r.failed_docs != null ? num(r.failed_docs) : NIL) + '</td>' +
      '<td class="sub" style="font-size:11.5px">' + (breakdown.length ? esc(breakdown.join(' · ')) : NIL) + '</td>' +
      '<td style="max-width:340px;white-space:normal;font-size:12px;color:var(--uzio-color-text-muted);line-height:1.5">' +
        esc((r && r.notes) || '') + '</td>' +
    '</tr>';
  }).join('');

  const counted = merged.filter(m => m.counts);
  const totalDocs = counted.reduce((n, m) => n + m.counts.documents, 0);
  const zero = counted.filter(m => m.counts.documents === 0);
  const checked = counted.length ? counted[0].counts.checked_at : null;

  el.innerHTML =
    buildFilters(DOC_FILTERS) +
    '<p style="font-size:12px;color:var(--uzio-color-text-muted);margin:0 0 12px">' +
      '<b>' + totalDocs.toLocaleString() + '</b> employee documents in Uzio across <b>' +
      counted.length + '</b> clients' +
      (zero.length ? ', and <b>' + zero.length + '</b> of them have none at all' : '') +
      '. Counted from prod' + (checked ? ' at ' + esc(String(checked).slice(0, 16).replace('T', ' ')) : '') +
      ', not taken from the transfer mails — an upload runs for hours, so a client ' +
      'can legitimately be part-way through.</p>' +
    '<div class="table-shell"><table class="uzio-table" id="docTable">' +
    '<thead><tr><th>Client</th><th>Coverage</th><th>Documents in Uzio</th>' +
    '<th>Transfer mail</th><th>Reported</th><th>Failed</th>' +
    '<th>Failure breakdown</th><th>Notes</th></tr></thead><tbody>' + body + '</tbody></table></div>';

  const records = Array.from(el.querySelectorAll('#docTable tbody tr')).map(tr => ({
    el: tr, name: tr.dataset.name, bucket: tr.dataset.bucket, hasFailed: tr.dataset.failed === '1'
  }));
  wireFilters(el, DOC_FILTERS, records, (r, s) =>
    (!s.q || r.name.indexOf(s.q) !== -1) &&
    (s.docStatus === 'all' || r.bucket === s.docStatus) &&
    (!s.docFailed || r.hasFailed),
    (n, total) => n + ' of ' + total + ' clients'
  );

  return { clients: counted.length, notDone: byStatus('Blocked') + byStatus('In progress'),
           zero: zero.length };
}

/* ==================== API ACTIVITY ==================== */
// SocCode / CompanyJobTitle / W2DeliveryMethod are deliberately excluded — nobody
// runs those onboarding APIs (CompanyJobTitle and W2DeliveryMethod have zero runs
// on record; SocCode has 6). Showing them made every client look like it had a gap.
const MODULES = [
  ['EmployeeCensus','Census'], ['PriorPayroll','Prior Payroll'], ['PaymentMethodSetup','Payment Method'],
  ['FedTaxWithholding','Federal Tax Withholding'], ['StateTaxWithholding','State Tax Withholding'],
  ['EmployeeDeductions','Deductions'], ['WorkerCompensation',"Worker's Comp"],
  ['EmployeeContributions','Contributions']
];
/* Columns come from the tracker, not from the run log.

   Building them from api_activity_runs (as this view used to) meant a DSP with
   no runs yet had no column at all — so the most urgent case, "goes live soon
   and nothing has been run", was the one thing the page could never show.

   DSPs new to the platform are excluded: they are not migrating from ADP or
   Paycom, so this matrix is not their workflow. */
const API_GOLIVE_DAYS = 30;   // default window

function apiClients(){
  const runsByFein = {};
  (DATA.api || []).forEach(r => {
    (runsByFein[r.fein] = runsByFein[r.fein] || {})[r.module_key] = r;
  });
  return (DATA.clients || [])
    .filter(c => c.previous_system === 'ADP' || c.previous_system === 'Paycom')
    .map(c => {
      const runs = runsByFein[c.fein] || {};
      const done = MODULES.filter(m => runs[m[0]]).length;
      const dates = MODULES.map(m => runs[m[0]] && runs[m[0]].last_run_date).filter(Boolean);
      const people = [...new Set(MODULES
        .map(m => runs[m[0]] && runs[m[0]].run_by).filter(Boolean)
        .map(p => p.split('.')[0]))];
      return {
        code: c.dsp_short_code,
        name: c.dsp_name,
        vendor: c.previous_system,
        // Two deadlines, and they are not the same day: payroll goes live about
        // a fortnight after time tracking, so which one you are working back
        // from changes who is urgent.
        live: c.actual_tt_live_date || '',
        payLive: c.payroll_live_date || '',
        runs, done,
        total: MODULES.length,
        lastRun: dates.length ? dates.sort().slice(-1)[0] : '',
        people,
        progress: done === 0 ? 'none' : (done === MODULES.length ? 'done' : 'partial')
      };
    })
    .sort((a, b) => a.name.localeCompare(b.name));
}

function daysFromToday(n){
  const d = new Date();
  d.setDate(d.getDate() + n);
  return isoLocal(d);
}

function renderApi(){
  const el = panel('api-content');
  const list = apiClients();
  if(!list.length){
    el.innerHTML = emptyNote('No ADP or Paycom DSPs in the tracker yet.');
    return { clientCount: 0 };
  }

  const today = isoLocal(new Date());
  const logCurrentTo = (DATA.api || []).reduce((m, r) => r.last_run_date > m ? r.last_run_date : m, '');

  const th = list.map(c =>
    '<th data-code="' + esc(c.code) + '" data-name="' + esc(c.name.toLowerCase()) + '">' +
    esc(c.name) + '<div class="sub">' + esc(c.vendor) +
    (c.live ? ' &middot; TT ' + esc(c.live.slice(5).replace('-', '/')) : '') +
    (c.payLive ? ' &middot; pay ' + esc(c.payLive.slice(5).replace('-', '/')) : '') + '</div></th>'
  ).join('');

  const body = MODULES.map(m =>
    '<tr><td class="sticky-col">' + esc(m[1]) + '</td>' + list.map(c => {
      const r = c.runs[m[0]];
      if(r) return '<td class="mcell" data-code="' + esc(c.code) + '">' +
        '<span class="uzio-status uzio-status--success">&#10003;</span>' +
        '<div class="sub">' + (r.last_run_date ? r.last_run_date.slice(5).replace('-', '/') : '') +
        ' &middot; ' + esc((r.run_by || '').split('.')[0]) + '</div></td>';
      return '<td class="mcell" data-code="' + esc(c.code) + '">' +
        '<span class="uzio-status uzio-status--error">&#10007;</span></td>';
    }).join('') + '</tr>'
  ).join('');

  const people = [...new Set(list.flatMap(c => c.people))].sort();

  el.innerHTML =
    '<div class="filter-bar">' +
      '<div class="uzio-search"><span class="uzio-search__icon">&#8981;</span>' +
        '<input class="uzio-search__input" id="apiSearch" placeholder="Search client…" aria-label="Search clients"></div>' +
      '<div class="chip-group" id="apiSource">' +
        '<button class="uzio-filter-chip" data-val="all">Any source</button>' +
        '<button class="uzio-filter-chip" data-val="ADP"><span class="uzio-filter-chip__dot" style="background:' + DOT.info + '"></span>ADP</button>' +
        '<button class="uzio-filter-chip" data-val="Paycom"><span class="uzio-filter-chip__dot" style="background:' + DOT.orange + '"></span>Paycom</button>' +
      '</div>' +
      '<div class="chip-group" id="apiProgress">' +
        '<button class="uzio-filter-chip" data-val="all">Any progress</button>' +
        '<button class="uzio-filter-chip" data-val="none"><span class="uzio-filter-chip__dot" style="background:' + DOT.bad + '"></span>Not started</button>' +
        '<button class="uzio-filter-chip" data-val="partial"><span class="uzio-filter-chip__dot" style="background:' + DOT.warn + '"></span>In progress</button>' +
        '<button class="uzio-filter-chip" data-val="done"><span class="uzio-filter-chip__dot" style="background:' + DOT.good + '"></span>All run</button>' +
      '</div>' +
    '</div>' +
    '<div class="filter-bar">' +
      '<div class="date-filter">' +
        '<select id="apiDateField" aria-label="Which go-live date to filter on">' +
          '<option value="either">TT or Payroll live</option>' +
          '<option value="live">TT live only</option>' +
          '<option value="payLive">Payroll live only</option>' +
        '</select>' +
      '</div>' +
      '<div class="chip-group" id="apiGoLive">' +
        '<button class="uzio-filter-chip" data-val="30">&le; 30 days</button>' +
        '<button class="uzio-filter-chip" data-val="15">&le; 15 days</button>' +
        '<button class="uzio-filter-chip" data-val="any">Any time</button>' +
      '</div>' +
      '<div class="date-filter">' +
        '<select id="apiRanBy" aria-label="Filter by who ran the modules">' +
          '<option value="all">Anyone</option>' +
          people.map(p => '<option value="' + esc(p) + '">' + esc(p) + '</option>').join('') +
        '</select>' +
        '<select id="apiRecency" aria-label="Filter by when a module last ran">' +
          '<option value="any">Ran any time</option>' +
          '<option value="7">Ran in last 7 days</option>' +
          '<option value="30">Ran in last 30 days</option>' +
        '</select>' +
      '</div>' +
      '<span class="result-count" id="apiCount"></span>' +
    '</div>' +
    '<div class="table-shell"><table class="uzio-table matrix-table" id="matrixTable">' +
      '<thead><tr><th class="sticky-col">Module</th>' + th + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<p style="font-size:11.5px;color:var(--uzio-color-text-faint);margin:8px 0 0">' +
      'Run log is a manual export, current to <b>' + esc(logCurrentTo || 'unknown') + '</b> — a cross can mean ' +
      '“not run” or “run after that date and not exported yet”. DSPs new to the platform are not shown.</p>';

  const table = el.querySelector('#matrixTable');
  const ths = Array.from(table.querySelectorAll('thead th[data-code]'));
  const byCode = {};
  list.forEach(c => { byCode[c.code] = c; });

  const state = { q: '', source: 'all', progress: 'all', goLive: String(API_GOLIVE_DAYS),
                  dateField: 'either', ranBy: 'all', recency: 'any' };

  function matches(c){
    if(state.q && c.name.toLowerCase().indexOf(state.q) === -1 &&
       c.code.toLowerCase().indexOf(state.q) === -1) return false;
    if(state.source !== 'all' && c.vendor !== state.source) return false;
    if(state.progress !== 'all' && c.progress !== state.progress) return false;
    if(state.goLive !== 'any'){
      // Upcoming go-lives only. A DSP with no date on the selected field cannot
      // be placed in the window, so it drops out rather than being assumed soon.
      const until = daysFromToday(Number(state.goLive));
      const fields = state.dateField === 'either' ? ['live', 'payLive'] : [state.dateField];
      const hit = fields.some(f => c[f] && c[f] >= today && c[f] <= until);
      if(!hit) return false;
    }
    if(state.ranBy !== 'all' && c.people.indexOf(state.ranBy) === -1) return false;
    if(state.recency !== 'any'){
      if(!c.lastRun) return false;
      if(c.lastRun < daysFromToday(-Number(state.recency))) return false;
    }
    return true;
  }

  function apply(){
    const shown = [];
    ths.forEach(th => {
      const c = byCode[th.dataset.code];
      const ok = matches(c);
      if(ok) shown.push(c);
      table.querySelectorAll('[data-code="' + c.code + '"]').forEach(x => x.classList.toggle('is-hidden', !ok));
    });
    el.querySelector('#apiCount').textContent = shown.length + ' of ' + list.length + ' DSPs';

  }

  el.querySelector('#apiSearch').addEventListener('input', e => {
    state.q = (e.target.value || '').toLowerCase().trim(); apply();
  });
  wireChips(el.querySelector('#apiSource'), v => { state.source = v; apply(); });
  wireChips(el.querySelector('#apiProgress'), v => { state.progress = v; apply(); });
  wireChips(el.querySelector('#apiGoLive'), v => { state.goLive = v; apply(); });
  el.querySelector('#apiDateField').addEventListener('change', e => {
    state.dateField = e.target.value; apply();
  });
  el.querySelector('#apiRanBy').addEventListener('change', e => { state.ranBy = e.target.value; apply(); });
  el.querySelector('#apiRecency').addEventListener('change', e => { state.recency = e.target.value; apply(); });


  apply();
  return { tracked: list.length, started: list.filter(c => c.done > 0).length };
}

/* ==================== OPEN ITEMS ==================== */
const SEV = [
  ['Needs action', 'critical'],
  ['Worth checking', 'warning'],
  ['Pending', 'alert']
];
const OPEN_FILTERS = {
  search: { id: 'openSearch', placeholder: 'Search open items…' },
  groups: [
    /* This group breaks the "first option shows everything" convention the other
       filter bars follow, on purpose: completed items accumulate forever, so the
       useful landing state is Open only, with All one click away. */
    { id: 'openStatus', options: [
      { val: 'Open', label: 'Open' },
      { val: 'Done', label: 'Done', dot: DOT.good },
      { val: 'all', label: 'All' }
    ]},
    { id: 'openSev', options: [
      { val: 'all', label: 'All severities' },
      { val: 'Needs action', label: 'Needs action', dot: DOT.bad },
      { val: 'Worth checking', label: 'Worth checking', dot: DOT.warn },
      { val: 'Pending', label: 'Pending', dot: DOT.info }
    ]}
  ],
  countId: 'openCount'
};
const SEVERITIES = ['Needs action', 'Worth checking', 'Pending'];
/* Assigned items carry an owner and a deadline; the rest are standing
   observations with neither, so the chips only appear when there is something
   to show. Overdue and due-today are called out — a due date that reads the
   same on the day after is not a deadline. */
function openMeta(r){
  const bits = [];
  const done = r.status === 'Done';
  if(done){
    /* A completed item's deadline is history — "Overdue" on something already
       closed reads as an outstanding problem, so the Done badge replaces it. */
    bits.push('<span class="uzio-status uzio-status--success">Done</span>');
  } else if(r.due_date){
    const today = new Date().toISOString().slice(0, 10);
    const late = r.due_date < today, now = r.due_date === today;
    const tone = late ? 'error' : (now ? 'warning' : 'neutral');
    bits.push('<span class="uzio-status uzio-status--' + tone + '">' +
      (late ? 'Overdue ' : (now ? 'Due today ' : 'Due ')) + fmtDate(r.due_date) + '</span>');
  }
  if(r.assignee){
    bits.push('<span class="uzio-chip">' + esc(r.assignee) + '</span>');
  }
  /* pending_for is the older, team-level owner ("Data Team (Rohit & Shobhit)")
     carried by rows seeded from Rohit's mail; assignee is the per-person field
     the form writes. Both show when both exist rather than one masking the other. */
  if(r.pending_for){
    bits.push('<span class="uzio-chip">' + esc(r.pending_for) + '</span>');
  }
  return bits.length ? '<span class="open-meta">' + bits.join('') + '</span>' : '';
}

/* The add-item form. Kept collapsed behind a button so the view still opens as
   a read-only board — the form is for the occasional write, not the main event. */
function openFormHtml(){
  return '<div class="oi-form" id="oiForm" hidden>' +
    '<div class="oi-grid">' +
      '<div class="oi-field oi-field--wide">' +
        '<label class="oi-label" for="oiTitle">Title</label>' +
        '<input class="oi-input" id="oiTitle" maxlength="200" placeholder="What needs doing">' +
      '</div>' +
      '<div class="oi-field oi-field--wide">' +
        '<label class="oi-label" for="oiDesc">Description</label>' +
        '<textarea class="oi-textarea" id="oiDesc" placeholder="Context, client, what &quot;done&quot; looks like"></textarea>' +
      '</div>' +
      '<div class="oi-field">' +
        '<label class="oi-label" for="oiSev">Severity</label>' +
        '<select class="oi-select" id="oiSev">' +
          SEVERITIES.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="oi-field">' +
        '<label class="oi-label" for="oiAssignee">Assignee</label>' +
        '<input class="oi-input" id="oiAssignee" maxlength="80" placeholder="Who owns it">' +
      '</div>' +
      '<div class="oi-field">' +
        '<label class="oi-label" for="oiDue">Due date</label>' +
        '<input class="oi-input" type="date" id="oiDue">' +
      '</div>' +
    '</div>' +
    '<div class="oi-actions">' +
      '<button class="oi-btn" id="oiSave">Add item</button>' +
      '<button class="oi-btn oi-btn--ghost" id="oiCancel">Cancel</button>' +
      '<span class="oi-msg" id="oiMsg"></span>' +
    '</div>' +
  '</div>';
}

function renderOpen(rows){
  const el = panel('open-content');

  /* Completed items leave the working set entirely and collect in their own
     block at the bottom, newest first — otherwise a closed item would keep
     showing up under its old severity heading as if it were still live. */
  const live = rows.filter(r => r.status !== 'Done');
  const done = rows.filter(r => r.status === 'Done')
    .sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));

  /* Assigned work with a deadline is a different kind of thing from the
     standing observations, and the severity order puts Pending last — so work
     due tomorrow would sit below ten notes about naming mismatches. It gets its
     own block at the top instead, soonest first. The rest still group by
     severity, and the severity chips keep working either way because filtering
     reads data-sev off each item, not the block it sits in. */
  const dated = live.filter(r => r.due_date)
    .sort((a, b) => a.due_date < b.due_date ? -1 : (a.due_date > b.due_date ? 1 : 0));
  const rest = live.filter(r => !r.due_date);

  const itemHtml = (r, cls) => {
    const isDone = r.status === 'Done';
    const foot = isDone
      ? '<div class="uzio-item__foot">Completed by ' + esc(r.completed_by || 'someone unnamed') +
        (r.completed_at ? ' on ' + esc(fmtDatePlain(String(r.completed_at).slice(0, 10))) : '') +
        '</div>'
      : '';
    const btn = isDone
      ? '<button class="oi-btn oi-btn--ghost oi-btn--mini" data-reopen="' + r.id + '">Reopen</button>'
      : '<button class="oi-btn oi-btn--mini" data-done="' + r.id + '">Mark as done</button>';
    return '<div class="uzio-item uzio-item--' + cls + (isDone ? ' uzio-item--done' : '') + '"' +
      ' data-sev="' + esc(r.severity) + '" data-status="' + esc(r.status) + '"' +
      ' data-text="' + esc(((r.title || '') + ' ' + (r.description || '') + ' ' +
        (r.assignee || '') + ' ' + (r.completed_by || '')).toLowerCase()) + '">' +
      '<span class="uzio-item__bar"></span>' +
      '<div class="uzio-item__body oi-row">' +
        '<div class="oi-row__main">' +
          '<div class="uzio-item__title">' + esc(r.title) + openMeta(r) + '</div>' +
          '<div class="uzio-item__desc">' + esc(r.description || '') + '</div>' + foot +
        '</div>' + btn +
      '</div></div>';
  };

  const clsFor = (sev) => (SEV.find(s => s[0] === sev) || [, 'alert'])[1];
  const block = (key, label, items) => items.length
    ? '<div class="section-block" data-sev-block="' + esc(key) + '">' +
      '<div class="uzio-section-label">' + esc(label) + ' &middot; ' + items.length + '</div>' +
      '<div class="err-list">' + items.map(r => itemHtml(r, clsFor(r.severity))).join('') +
      '</div></div>'
    : '';

  const groups =
    block('__assigned', 'Assigned', dated) +
    SEV.map(([sev]) => block(sev, sev, rest.filter(r => r.severity === sev))).join('') +
    block('__done', 'Done', done);

  const me = getMe();
  const bar =
    '<div class="oi-bar">' +
      '<button class="oi-btn" id="oiToggle">+ Add item</button>' +
      '<div class="oi-me">' +
        '<label for="oiMe">You are</label>' +
        '<input class="oi-input oi-input--sm" id="oiMe" maxlength="60" placeholder="Your name"' +
          ' value="' + esc(me) + '">' +
      '</div>' +
    '</div>';

  el.innerHTML = bar + openFormHtml() + buildFilters(OPEN_FILTERS) + groups;

  const records = Array.from(el.querySelectorAll('.uzio-item')).map(it => ({
    el: it, sev: it.dataset.sev, status: it.dataset.status, text: it.dataset.text
  }));
  wireFilters(el, OPEN_FILTERS, records, (r, s) =>
    (!s.q || r.text.indexOf(s.q) !== -1) &&
    (s.openSev === 'all' || r.sev === s.openSev) &&
    (s.openStatus === 'all' || r.status === s.openStatus),
    (n, total) => n + ' of ' + total + ' items'
  );

  wireOpenOnce(el);
  syncOpenBlocks(el);
  wireOpenForm(el);
}

// A severity heading with every item filtered out would just be a dangling
// label, so hide the whole block once its list empties.
function syncOpenBlocks(el){
  el.querySelectorAll('[data-sev-block]').forEach(b => {
    const any = Array.from(b.querySelectorAll('.uzio-item')).some(i => i.style.display !== 'none');
    b.style.display = any ? '' : 'none';
  });
}

function openMsg(el, text, kind){
  const msg = el.querySelector('#oiMsg');
  if(!msg) return;
  msg.textContent = text || '';
  msg.className = 'oi-msg' + (kind ? ' oi-msg--' + kind : '');
}

/* Listeners that live on the panel itself rather than on its contents.
   renderOpen now runs again after every write, and panel() hands back the SAME
   element each time — so attaching here on each render would stack a second,
   third, nth copy of these handlers, and one "Mark as done" click would fire a
   PATCH per accumulated listener. Attach once, keyed off a flag on the node,
   and look everything up at event time so nothing closes over a stale render. */
function wireOpenOnce(el){
  if(el.dataset.oiWired) return;
  el.dataset.oiWired = '1';

  el.addEventListener('input', () => syncOpenBlocks(el));
  el.addEventListener('click', () => syncOpenBlocks(el));

  el.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-done],[data-reopen]');
    if(!btn || btn.disabled) return;
    const doneId = btn.dataset.done, reopenId = btn.dataset.reopen;
    const meInput = el.querySelector('#oiMe');
    const name = (meInput && meInput.value.trim()) || '';

    // Closing records who did it, so a name is required. Point at the name box
    // and nothing else: revealing #oiForm here (as this once did) puts the
    // "Add item" form on screen, which has no name field in it and reads as
    // "fill this in to continue" — people typed "Completed" into the title.
    if(doneId && !name){
      openMsg(el, 'Enter your name in the "You are" box first — it is recorded as who closed the item.', 'err');
      if(meInput){
        meInput.classList.add('oi-input--needed');
        meInput.addEventListener('input',
          () => meInput.classList.remove('oi-input--needed'), { once: true });
        meInput.focus();
      }
      return;
    }
    if(doneId) setMe(name);

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = doneId ? 'Saving…' : 'Reopening…';
    const body = doneId
      ? { status: 'Done', completed_by: name, completed_at: new Date().toISOString() }
      : { status: 'Open', completed_by: null, completed_at: null };
    try {
      await sbWrite('open_items?id=eq.' + (doneId || reopenId), 'PATCH', body);
      await reloadOpen();
    } catch(err){
      btn.disabled = false;
      btn.textContent = original;
      // Message only — the write failed, and opening the "Add item" form here
      // just suggests the wrong next step.
      openMsg(el, 'Could not update: ' + err.message, 'err');
    }
  });
}

/* Wiring for the controls rebuilt on every render. These nodes are new each
   time and the old ones are discarded with their listeners, so no guard needed. */
function wireOpenForm(el){
  const form = el.querySelector('#oiForm');
  const meInput = el.querySelector('#oiMe');

  meInput.addEventListener('input', () => setMe(meInput.value.trim()));

  el.querySelector('#oiToggle').addEventListener('click', () => {
    form.hidden = !form.hidden;
    openMsg(el, '');
    if(!form.hidden) el.querySelector('#oiTitle').focus();
  });
  el.querySelector('#oiCancel').addEventListener('click', () => {
    form.hidden = true;
    openMsg(el, '');
  });

  const saveBtn = el.querySelector('#oiSave');
  saveBtn.addEventListener('click', async () => {
    const titleEl = el.querySelector('#oiTitle');
    const title = titleEl.value.trim();
    if(!title){ openMsg(el, 'A title is required.', 'err'); titleEl.focus(); return; }
    const payload = {
      title: title,
      description: el.querySelector('#oiDesc').value.trim() || null,
      severity: el.querySelector('#oiSev').value,
      assignee: el.querySelector('#oiAssignee').value.trim() || null,
      due_date: el.querySelector('#oiDue').value || null,
      status: 'Open'
    };
    saveBtn.disabled = true;
    openMsg(el, 'Saving…');
    try {
      await sbWrite('open_items', 'POST', payload);
      await reloadOpen();   // re-renders: this handler's nodes are gone after here
    } catch(err){
      saveBtn.disabled = false;
      openMsg(el, 'Could not save: ' + err.message, 'err');
    }
  });
}

/* ==================== DATA COVERAGE ====================
   How many of a client's people actually have the data loaded, counted straight
   from prod. This is the complement to API Activity: that view says an API
   *ran*, this one says whether the run landed. A client can show a census run
   months ago and still have zero payment methods.

   Two denominators, switched by the first chip group, because they answer
   different questions and neither can be derived from the other:
     active — still employed. "Can we run payroll for this client?"
     all    — every non-deleted employee, leavers included. Migration completeness.
   The gap between them is large enough to invert the story: Wheels for Work
   reads 2396 of 2396 on payment method against all, but 172 of 172 against
   active, and TRUDELO reads 11% against all versus 100% against active.

   This view keeps its own state and re-renders rather than using
   wireFilters: the denominator switch and the metric tiles change the numbers
   themselves, not just which rows survive, so they cannot be expressed as a
   row-visibility predicate. Search is the exception — it filters in place, so
   typing does not blow away the input's focus. */
const COV = {
  mode: 'active',      // active | total          — denominator
  metric: 'all',       // all | pay | emg | lic   — set by the summary tiles
  sev: 'all',          // all | complete | partial | none
  vendor: 'any',
  q: '',
  sortKey: 'worst',    // worst | name | emp | pay | emg | lic
  sortDir: 'asc'
};

const COV_METRICS = [
  { key: 'pay', label: 'Payment method', have: 'with_payment_method' },
  { key: 'emg', label: 'Emergency contact', have: 'with_emergency_contact' },
  { key: 'lic', label: 'Driving licence', have: 'with_licence' },
  { key: 'wc',  label: 'Worker comp', have: 'with_worker_comp' }
];

function covPct(n, d){
  if(!d) return 0;
  const p = Math.round(n / d * 100);
  // Never let rounding claim a clean 100% while people are still missing
  // (995 of 1,000 is 99.5%), nor show 0% when some are already in.
  if(p === 100 && n < d) return 99;
  if(p === 0 && n > 0) return 1;
  return p;
}

function covFill(pct){
  return pct === 100 ? '' : (pct >= 50 ? ' uzio-progress__fill--warn' : ' uzio-progress__fill--error');
}

function covBar(pct){
  return '<div class="uzio-progress"><div class="uzio-progress__fill' + covFill(pct) +
    '" style="width:' + pct + '%"></div></div>';
}

/* A cell leads with the percentage and states the shortfall, not the count that
   is already covered: "36 missing" is the thing somebody has to act on, and the
   denominator is right there in the Employees column, so repeating "of 172" in
   all three cells was three copies of a number the row already carries. The
   full n-of-m stays in the tooltip. */
function covCell(n, d){
  if(!d) return '<td class="cov-cell">' + NIL + '</td>';
  const pct = covPct(n, d), short = d - n;
  return '<td class="cov-cell" title="' + n + ' of ' + d + '">' +
    '<div class="cov-cell__pct">' + pct + '%</div>' +
    covBar(pct) +
    '<div class="cov-cell__gap">' + (short > 0 ? short.toLocaleString() + ' missing' : 'complete') +
    '</div></td>';
}

/* Load history for one client: when employees actually arrived, in what size
   batches, and who put them there.

   This is the cross-check on API Activity. api_activity_runs holds one
   last_run_date per module, which cannot distinguish "the census loaded 982
   people" from "somebody added 7 stragglers three weeks later" — for Stave it
   records only the second. The bars show both, so a claimed run with no batch
   behind it is visible, and so is a real load the log dated wrongly. */
/* Pick the coarsest-needed period so the chart stays on one screen. Day while
   the history is short, then week, then month. */
const TL_MAX_SLOTS = 40;
const TL_GRAINS = [
  ['day', d => d, d => fmtDatePlain(d)],
  ['week', d => { const t = new Date(d + 'T00:00:00');
                  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));   // back to Monday
                  return isoLocal(t); },
   d => 'week of ' + fmtDatePlain(d)],
  ['month', d => d.slice(0, 7) + '-01',
   d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })]
];

function tlGrain(dates){
  for(let i = 0; i < TL_GRAINS.length; i++){
    const [unit, key, label] = TL_GRAINS[i];
    const n = new Set(dates.map(key)).size;
    if(n <= TL_MAX_SLOTS || i === TL_GRAINS.length - 1)
      return { unit: unit, key: key, label: label, slots: n };
  }
}

function covTimeline(evs){
  if(!evs.length) return '<div class="cov-tl__empty">No load history recorded for this client.</div>';

  const added = evs.filter(e => e.kind === 'added')
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
  const totalAdded = added.reduce((s, e) => s + (e.employees || 0), 0);

  // The day the bulk landed, and the day the majority had landed by — the two
  // questions a single last_run_date cannot answer.
  const biggest = added.reduce((m, e) => (!m || e.employees > m.employees) ? e : m, null);
  let running = 0, majorityOn = null;
  added.forEach(e => {
    running += e.employees || 0;
    if(!majorityOn && totalAdded && running >= totalAdded / 2) majorityOn = e;
  });

  /* One slot per period. Day is the natural grain, but 55th and 3rd has eight
     months of history: 148 day-slots, which scroll sideways and — worse — put
     39 single-person days beside a 258-person one, where each of them clamps to
     the same 3px stub and nothing can be told apart. Widen the period until the
     chart fits on screen, so every bar carries a readable quantity. */
  const grain = tlGrain(evs.map(e => (e.event_date || '').slice(0, 10)));

  const byDate = {};
  evs.forEach(e => {
    const d = grain.key((e.event_date || '').slice(0, 10));
    const slot = byDate[d] || (byDate[d] = { d: d, add: 0, term: 0, actors: {}, type: null });
    if(e.kind === 'added'){
      slot.add += e.employees || 0;
      slot.actors[e.actor] = (slot.actors[e.actor] || 0) + (e.employees || 0);
      // the slot takes the colour of whoever put the most people in it
      if(!slot.type || slot.actors[e.actor] > slot.top) { slot.type = e.actor_type; slot.top = slot.actors[e.actor]; }
    } else {
      slot.term += e.employees || 0;
    }
  });
  const slots = Object.keys(byDate).sort().map(k => byDate[k]);
  const peak = Math.max.apply(null, slots.map(s => Math.max(s.add, s.term)).concat([1]));

  /* Square-root heights, not linear. Linearly a 1-person day against a
     258-person peak is 0.4% — below the 3px floor, so the entire tail rendered
     as one flat row of identical stubs and the only way to read the chart was
     to hover every bar. Root keeps the order and the peak intact while giving
     the small days a height you can actually compare. It does mean height is
     not proportional to count, so the legend says so and the big bars carry
     their number. */
  // Tops out at 90%, not 100%: overflow-x:auto on the chart forces overflow-y to
  // clip too, so a full-height bar would have its printed value cut off.
  const h = (v) => v > 0 ? Math.max(4, Math.round(Math.sqrt(v / peak) * 90)) : 0;
  // Print the count only where it will not collide with its neighbours.
  const labelAt = Math.max(peak * 0.25, 10);

  const bars = slots.map(s => {
    // Per-actor counts only when the period had more than one — otherwise the
    // total is simply repeated back ("263 added by birajpal.singh1 (263)").
    const names = Object.keys(s.actors);
    const who = names.length > 1
      ? names.map(a => a + ' (' + s.actors[a].toLocaleString() + ')').join(', ')
      : names.join('');
    const tip = grain.label(s.d) +
      (s.add ? ' · ' + s.add.toLocaleString() + ' added' + (who ? ' by ' + who : '') : '') +
      (s.term ? ' · ' + s.term.toLocaleString() + ' left' : '');
    const val = (n) => n >= labelAt ? '<span class="cov-tl__val">' + n.toLocaleString() + '</span>' : '';
    return '<div class="cov-tl__slot" title="' + esc(tip) + '">' +
      (s.add ? '<div class="cov-tl__bar cov-tl__bar--' + esc(s.type || 'staff') +
        '" style="height:' + h(s.add) + '%">' + val(s.add) + '</div>' : '') +
      (s.term ? '<div class="cov-tl__bar cov-tl__bar--term" style="height:' +
        h(s.term) + '%"></div>' : '') +
    '</div>';
  }).join('');

  const axis = slots.length
    ? '<div class="cov-tl__axis"><span>' + esc(fmtDatePlain(slots[0].d)) + '</span>' +
      '<span>' + esc(grain.unit === 'day' ? 'one bar per day'
        : 'one bar per ' + grain.unit + ' · ' + slots.length + ' ' + grain.unit + 's') + '</span>' +
      '<span>' + esc(fmtDatePlain(slots[slots.length - 1].d)) + '</span></div>'
    : '';

  const pct = (n) => covPct(n, totalAdded);
  const head =
    (biggest ? 'Biggest load <b>' + fmtDate(biggest.event_date) + '</b> — ' +
      biggest.employees.toLocaleString() + ' employees (' + pct(biggest.employees) +
      '% of everyone ever loaded) by <b>' + esc(biggest.actor) + '</b>.' : '') +
    (majorityOn ? '<br>Half of them were in by <b>' + fmtDate(majorityOn.event_date) + '</b>.' : '') +
    '<br>' + added.length + ' load event' + (added.length === 1 ? '' : 's') + ' in total, ' +
      totalAdded.toLocaleString() + ' employees added.';

  return '<div class="cov-tl__head">' + head + '</div>' +
    '<div class="cov-tl__chart">' + bars + '</div>' + axis +
    '<div class="cov-tl__legend">' +
      '<span><i class="cov-tl__key" style="background:var(--uzio-color-action)"></i>Added by Uzio staff</span>' +
      '<span><i class="cov-tl__key" style="background:var(--uzio-color-orange)"></i>Added by the client</span>' +
      '<span><i class="cov-tl__key" style="background:var(--uzio-color-success)"></i>Added by SYSTEM</span>' +
      '<span><i class="cov-tl__key" style="background:var(--uzio-color-error)"></i>Left (since first load)</span>' +
      '<span>Bar heights use a square-root scale, so a tall bar is worth more ' +
        'than it looks — hover any bar for the exact count.</span>' +
    '</div>';
}

function renderCoverage(){
  const el = panel('coverage-content');
  const rows = DATA.coverage || [];
  const active = COV.mode === 'active';
  const suffix = active ? 'active_' : 'total_';
  const den = r => (active ? r.active_employees : r.total_employees) || 0;
  const got = (r, m) => (r[suffix + m.have]) || 0;

  // client_overview.vendor only ever holds ADP, Paycom or null — there is no
  // 'New' value in the data. Defaulting null to 'New' mislabelled 64 DSPs,
  // Stave among them, which is mid-migration from Paycom.
  const vendorOf = {};
  (DATA.clients || []).forEach(c => { vendorOf[c.dsp_short_code] = c.vendor || 'Not set'; });

  // One pass builds everything the tiles, the filters and the table need.
  const items = rows.map(r => {
    const d = den(r);
    const pcts = {};
    COV_METRICS.forEach(m => { pcts[m.key] = covPct(got(r, m), d); });
    // Severity is judged on the selected metric, or on the weakest of the three
    // when no metric is picked — otherwise "complete" would mean different
    // things depending on which tile happened to be active.
    const relevant = COV.metric === 'all'
      ? COV_METRICS.map(m => pcts[m.key])
      : [pcts[COV.metric]];
    const worst = Math.min.apply(null, relevant);
    return {
      r: r, d: d, pcts: pcts,
      vendor: vendorOf[r.dsp_short_code] || 'Not set',
      sev: d === 0 ? 'complete' : (worst === 0 ? 'none' : (worst === 100 ? 'complete' : 'partial')),
      score: COV_METRICS.reduce((s, m) => s + pcts[m.key], 0),
      name: ((r.company_name || '') + ' ' + (r.dsp_short_code || '')).toLowerCase()
    };
  });

  // Tiles summarise the whole population, not the filtered slice — they are the
  // headline number and must not move when someone narrows the table.
  const tiles = COV_METRICS.map(m => {
    const tot = items.reduce((s, i) => s + i.d, 0);
    const have = rows.reduce((s, r) => s + ((r[suffix + m.have]) || 0), 0);
    const done = items.filter(i => i.d > 0 && i.pcts[m.key] === 100).length;
    const zero = items.filter(i => i.d > 0 && i.pcts[m.key] === 0).length;
    const pct = covPct(have, tot);
    return { m: m, pct: pct, have: have, tot: tot, done: done, zero: zero };
  });

  const tileHtml = '<div class="cov-metrics">' + tiles.map(t =>
    '<button class="cov-metric' + (COV.metric === t.m.key ? ' is-active' : '') +
      '" data-metric="' + t.m.key + '">' +
      '<div class="cov-metric__label">' + esc(t.m.label) + '</div>' +
      '<div class="cov-metric__pct">' + t.pct + '%</div>' +
      covBar(t.pct) +
      '<div class="cov-metric__sub">' + t.have.toLocaleString() + ' of ' + t.tot.toLocaleString() +
        ' employees<br>' + t.done + ' clients complete &middot; ' + t.zero + ' with none</div>' +
    '</button>').join('') + '</div>';

  const chips = (id, opts, cur) =>
    '<div class="chip-group" id="' + id + '">' + opts.map(o =>
      '<button class="uzio-filter-chip' + (cur === o.val ? ' is-active' : '') +
      '" data-val="' + esc(o.val) + '">' +
      (o.dot ? '<span class="uzio-filter-chip__dot" style="background:' + o.dot + '"></span>' : '') +
      esc(o.label) + '</button>').join('') + '</div>';

  const filterHtml =
    '<div class="filter-row"><span class="filter-row__label">Count</span>' +
      chips('covMode', [
        { val: 'active', label: 'Active employees' },
        { val: 'total', label: 'All (incl. leavers)' }
      ], COV.mode) +
      '<span class="filter-row__label" style="margin-left:8px">Status</span>' +
      chips('covSev', [
        { val: 'all', label: 'All' },
        { val: 'complete', label: 'Complete', dot: DOT.good },
        { val: 'partial', label: 'Partial', dot: DOT.warn },
        { val: 'none', label: 'Nothing loaded', dot: DOT.bad }
      ], COV.sev) +
    '</div>' +
    '<div class="filter-row"><span class="filter-row__label">Source</span>' +
      chips('covVendor', [
        { val: 'any', label: 'Any' }, { val: 'ADP', label: 'ADP' },
        { val: 'Paycom', label: 'Paycom' }, { val: 'Not set', label: 'Not set' }
      ], COV.vendor) +
      '<div class="uzio-search" style="margin-left:8px"><span class="uzio-search__icon">&#8981;</span>' +
        '<input class="uzio-search__input" id="covSearch" placeholder="Search client or code" ' +
        'aria-label="Search client or code" value="' + esc(COV.q) + '"></div>' +
      '<span class="result-count" id="covCount"></span>' +
    '</div>';

  const dir = COV.sortDir === 'asc' ? 1 : -1;
  const sorted = items.slice().sort((a, b) => {
    if(COV.sortKey === 'name') return dir * a.name.localeCompare(b.name);
    if(COV.sortKey === 'emp') return dir * (a.d - b.d);
    if(COV.sortKey === 'worst') return (a.score - b.score) * dir || b.d - a.d;
    return dir * (a.pcts[COV.sortKey] - b.pcts[COV.sortKey]) || b.d - a.d;
  });

  const body = sorted.map(i => {
    const r = i.r;
    return '<tr class="cov-row' + (i.sev === 'none' ? ' cov-none' : '') +
      '" data-code="' + esc(r.dsp_short_code || '') +
      '" data-name="' + esc(i.name) + '" data-sev="' + i.sev +
      '" data-vendor="' + esc(i.vendor) + '">' +
      '<td class="name-cell"><b title="' + esc(r.company_name) + '">' + esc(r.company_name) + '</b>' +
        '<div class="sub">' + esc(r.dsp_short_code || '') + ' &middot; ' + esc(i.vendor) +
        (r.worker_comp_codes ? ' &middot; ' + esc(r.worker_comp_codes) : '') + '</div></td>' +
      '<td>' + num(i.d) + '</td>' +
      COV_METRICS.map(m => covCell(got(r, m), i.d)).join('') +
      '</tr>';
  }).join('');

  const sortTh = (key, label) =>
    '<th class="sortable' + (COV.sortKey === key ? (COV.sortDir === 'asc' ? ' sort-asc' : ' sort-desc') : '') +
    '" data-sort="' + key + '">' + label + '</th>';

  el.innerHTML = tileHtml + filterHtml +
    '<div class="table-shell"><table class="uzio-table" id="covTable"><thead><tr>' +
      sortTh('name', 'Client') +
      sortTh('emp', (active ? 'Active' : 'All') + ' employees') +
      COV_METRICS.map(m => sortTh(m.key, m.label)).join('') +
    '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<div class="cov-foot">Counted from prod on ' + fmtDate(rows.length ? rows[0].checked_date : null) +
      '. Percentages are of ' + (active ? 'employees still on the books' : 'every employee ever loaded') +
      '.</div>';

  /* ---- wiring: anything that changes the numbers re-renders ---- */
  const rerender = (fn) => (e) => {
    const btn = e.target.closest('[data-val],[data-metric],[data-sort]');
    if(!btn) return;
    fn(btn);
    renderCoverage();
  };
  el.querySelector('.cov-metrics').addEventListener('click', rerender(btn => {
    const k = btn.dataset.metric;
    COV.metric = (COV.metric === k) ? 'all' : k;   // second click clears it
  }));
  el.querySelector('#covMode').addEventListener('click', rerender(b => { COV.mode = b.dataset.val; }));
  el.querySelector('#covSev').addEventListener('click', rerender(b => { COV.sev = b.dataset.val; }));
  el.querySelector('#covVendor').addEventListener('click', rerender(b => { COV.vendor = b.dataset.val; }));
  el.querySelector('thead').addEventListener('click', rerender(b => {
    const k = b.dataset.sort;
    if(COV.sortKey === k) COV.sortDir = COV.sortDir === 'asc' ? 'desc' : 'asc';
    else { COV.sortKey = k; COV.sortDir = k === 'name' ? 'asc' : 'asc'; }
  }));

  /* ---- a client opens its own page, not an inline panel ---- */
  el.querySelector('#covTable tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr.cov-row');
    if(tr) showClient(tr.dataset.code, 'coverage');
  });

  /* ---- search filters in place so the box keeps focus ---- */
  const trs = Array.from(el.querySelectorAll('#covTable tbody tr.cov-row'));
  const countEl = el.querySelector('#covCount');
  function applyRows(){
    let shown = 0;
    trs.forEach(tr => {
      const ok =
        (!COV.q || tr.dataset.name.indexOf(COV.q) !== -1) &&
        (COV.sev === 'all' || tr.dataset.sev === COV.sev) &&
        (COV.vendor === 'any' || tr.dataset.vendor === COV.vendor);
      tr.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    countEl.textContent = shown + ' of ' + trs.length + ' clients';
  }
  const box = el.querySelector('#covSearch');
  box.addEventListener('input', () => { COV.q = box.value.toLowerCase().trim(); applyRows(); });
  applyRows();

  const totAll = items.reduce((s, i) => s + i.d, 0);
  return {
    clients: rows.length,
    pay: covPct(rows.reduce((s, r) => s + ((r[suffix + 'with_payment_method']) || 0), 0), totAll),
    emg: covPct(rows.reduce((s, r) => s + ((r[suffix + 'with_emergency_contact']) || 0), 0), totAll),
    lic: covPct(rows.reduce((s, r) => s + ((r[suffix + 'with_licence']) || 0), 0), totAll),
    wc:  covPct(rows.reduce((s, r) => s + ((r[suffix + 'with_worker_comp']) || 0), 0), totAll)
  };
}

/* ==================== PAYROLL HEALTH CHECK ====================
   Does every TY2026 pay period that has run have payroll behind it, and where
   does the handover from the old vendor sit.

   Built as a checks page rather than a single table because more checks are
   coming (QOT period coverage, prior-payroll file coverage, daily-bot versus
   historical-bot agreement). Today it carries one: Uzio-side coverage.

   Two things the numbers only make sense with:
   - Coverage is an interval union, not a period count. Prior payroll arrives in
     consolidated buckets — Lazo's whole pre-go-live year is four rows, one
     spanning 2025-12-14 to 2026-03-21 — so counting rows against the weekly
     calendar reported 23 missing periods for a client that is fully covered.
   - A client new to the platform has no previous system to load from, so an
     empty pre-go-live stretch is correct. Without separating those, 12 of 21
     flagged clients were false alarms. */
const HEALTH_STATUS_CLASS = {
  'Covered': 'success',
  'Handover gap': 'error',
  'Gap': 'warning',
  'New to platform': 'neutral'
};

const HEALTH_FILTERS = {
  search: { id: 'hcSearch', placeholder: 'Search client or code' },
  groups: [
    { id: 'hcStatus', options: [
      { val: 'all', label: 'All' },
      { val: 'Handover gap', label: 'Handover gap', dot: DOT.bad },
      { val: 'Gap', label: 'Gap', dot: DOT.warn },
      { val: 'Covered', label: 'Covered', dot: DOT.good },
      { val: 'New to platform', label: 'New to platform' }
    ]}
  ],
  countId: 'hcCount'
};

function span(a, b){
  return (a && b) ? fmtDate(a) + ' – ' + fmtDate(b) : NIL;
}

function renderHealth(rows){
  const el = panel('health-content');
  if(!rows.length) return el.innerHTML = emptyNote('Nothing scored yet.'), null;

  /* Ordering by gap size alone put Spring Logistics on top with 220 uncovered
     days — a client new to the platform, where those days are correct. Real
     problems lead; new-to-platform sinks to the bottom regardless of size. */
  const RANK = { 'Handover gap': 0, 'Gap': 1, 'Covered': 2, 'New to platform': 3 };
  rows = rows.slice().sort((a, b) => {
    const ra = RANK[a.status] ?? 9, rb = RANK[b.status] ?? 9;
    return ra !== rb ? ra - rb : (b.gap_days || 0) - (a.gap_days || 0);
  });

  const n = (s) => rows.filter(r => r.status === s).length;
  const scored = rows.filter(r => r.status !== 'New to platform').length;
  const gaps = n('Gap') + n('Handover gap');

  /* The handover tile is called out on its own because it is the failure this
     page exists to catch: the old vendor stopped, Uzio started, and a week fell
     between the two. Looking at either side alone shows nothing wrong. */
  const tiles =
    '<div class="cov-metrics">' +
      '<div class="cov-metric" style="cursor:default">' +
        '<div class="cov-metric__label">Covered</div>' +
        '<div class="cov-metric__pct">' + n('Covered') + '</div>' +
        '<div class="cov-metric__sub">of ' + scored + ' clients with a previous system</div></div>' +
      '<div class="cov-metric" style="cursor:default">' +
        '<div class="cov-metric__label">Handover gap</div>' +
        '<div class="cov-metric__pct">' + n('Handover gap') + '</div>' +
        '<div class="cov-metric__sub">a week that neither the old vendor<br>nor Uzio has payroll for</div></div>' +
      '<div class="cov-metric" style="cursor:default">' +
        '<div class="cov-metric__label">Other gaps</div>' +
        '<div class="cov-metric__pct">' + n('Gap') + '</div>' +
        '<div class="cov-metric__sub">uncovered stretch elsewhere in TY2026</div></div>' +
      '<div class="cov-metric" style="cursor:default">' +
        '<div class="cov-metric__label">New to platform</div>' +
        '<div class="cov-metric__pct">' + n('New to platform') + '</div>' +
        '<div class="cov-metric__sub">no previous system — nothing to load</div></div>' +
    '</div>';

  const body = rows.map(r => {
    const cls = HEALTH_STATUS_CLASS[r.status] || 'neutral';
    return '<tr data-name="' + esc(((r.company_name || '') + ' ' + (r.dsp_short_code || '')).toLowerCase()) +
      '" data-status="' + esc(r.status) + '">' +
      '<td class="name-cell"><b title="' + esc(r.company_name) + '">' + esc(r.company_name) + '</b>' +
        '<div class="sub">' + esc(r.dsp_short_code || '') + ' &middot; ' +
        esc(r.previous_system || 'not set') + '</div></td>' +
      '<td><span class="uzio-status uzio-status--' + cls + '">' + esc(r.status) + '</span></td>' +
      '<td class="sub">' + span(r.prior_from, r.prior_to) + '</td>' +
      '<td class="sub">' + span(r.normal_from, r.normal_to) + '</td>' +
      '<td>' + (r.gap_days ? '<span class="tnum">' + r.gap_days + '</span> days' : NIL) + '</td>' +
      '<td class="sub" style="white-space:normal;max-width:260px">' +
        esc(r.gap_ranges || '') + '</td>' +
    '</tr>';
  }).join('');

  el.innerHTML = tiles + buildFilters(HEALTH_FILTERS) +
    '<div class="table-shell"><table class="uzio-table" id="hcTable"><thead><tr>' +
    '<th>Client</th><th>TY2026 coverage</th><th>Prior payroll (old vendor)</th>' +
    '<th>Uzio payrolls</th><th>Uncovered</th><th>Gap dates</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<div class="cov-foot">Coverage is measured against the pay periods that have actually run, ' +
    'from ' + fmtDate(rows[0].target_from) + ' to each client\'s latest completed period. ' +
    'Checked ' + fmtDate(rows[0].checked_date) + '.</div>';

  const records = Array.from(el.querySelectorAll('#hcTable tbody tr')).map(tr => ({
    el: tr, name: tr.dataset.name, status: tr.dataset.status
  }));
  wireFilters(el, HEALTH_FILTERS, records, (r, s) =>
    (!s.q || r.name.indexOf(s.q) !== -1) &&
    (s.hcStatus === 'all' || r.status === s.hcStatus),
    (a, total) => a + ' of ' + total + ' clients'
  );

  return { scored: scored, gaps: gaps };
}

/* ==================== INIT ==================== */
async function loadAll(){
  const out = {};
  const fail = (id) => (e) => { panel(id).innerHTML = '<div class="err-box">' + esc(e.message) + '</div>'; };

  // client_overview is fetched on its own first: API Activity now builds its
  // columns from the tracker (so DSPs with no runs still appear), so it cannot
  // start until this has landed. Running it inside the parallel block raced.
  try {
    DATA.clients = await sbGet(
      'client_overview?select=*,client_work_locations(work_location_name,address_line1,' +
      'address_line2,city,state,zip_code,is_primary)&order=dsp_name.asc');
    out.overview = renderOverview(DATA.clients);
  } catch(e){ fail('overview-content')(e); }

  await Promise.all([
    // Historical data is four tables now: who is tracked, the report catalogue,
    // one status row per expected file, and whether the old platform can still
    // be reached at all — without which a 'Pending' row cannot be told apart
    // from data nobody will ever be able to fetch.
    Promise.all([
      sbGet('historical_scope?select=*,client_overview(dsp_name)&order=entered_on.desc'),
      sbGet('historical_report_catalog?select=*&order=vendor.asc,sort_order.asc'),
      sbGet('historical_report_status?select=*'),
      sbGet('client_platform_access?select=*'),
      sbGet('historical_scope_excluded?select=*')
    ]).then(([scope, catalog, status, access, excluded]) => {
      DATA.histScope = scope; DATA.histCatalog = catalog; DATA.histStatus = status;
      DATA.access = {};
      (access || []).forEach(a => { DATA.access[a.dsp_short_code] = a; });
      // Someone decided these are not collectable, and that decision is newer
      // than the access spreadsheet — without it the page recommends chasing
      // the very clients that were just dropped for having no access.
      DATA.accessExcluded = {};
      (excluded || []).forEach(x => { DATA.accessExcluded[x.dsp_short_code] = x; });
      renderHistorical();
    }).catch(fail('historical-content')),
    sbGet('audit_coverage?select=*&order=client_name.asc')
      .then(r => { DATA.audit = r; renderAudit(r); }).catch(fail('audit-content')),
    // The mail record and the row count are two different facts, so both are
    // fetched and shown side by side rather than one standing in for the other.
    Promise.all([
      sbGet('document_transfer?select=*&order=client_name.asc'),
      sbGet('client_document_counts?select=*')
    ]).then(([transfer, counts]) => {
      DATA.documents = transfer;
      DATA.docCounts = {};
      (counts || []).forEach(c => { DATA.docCounts[c.dsp_short_code] = c; });
      out.docs = renderDocuments(transfer);
    }).catch(fail('documents-content')),
    sbGet('api_activity_runs?select=*&order=client_name.asc')
      .then(r => { DATA.api = r; out.api = renderApi(); }).catch(fail('api-content')),
    sbGet('client_data_coverage?select=*&order=company_name.asc')
      .then(r => { DATA.coverage = r; out.coverage = renderCoverage(); }).catch(fail('coverage-content')),
    sbGet('payroll_health?select=*&order=gap_days.desc')
      .then(r => { DATA.health = r; out.health = renderHealth(r); }).catch(fail('health-content')),
    sbGet('open_items?select=*&order=date_added.desc')
      .then(r => { DATA.open = r; renderOpen(r); }).catch(fail('open-content'))
  ]);

  const parts = [];
  if(out.overview) parts.push(out.overview.total + ' DSPs · ' + out.overview.withFein + ' matched to prod');
  if(out.api) parts.push('API: ' + out.api.started + ' of ' + out.api.tracked + ' started');
  if(out.docs) parts.push('Docs: ' + out.docs.clients + ' clients · ' + out.docs.notDone + ' not done');
  if(out.coverage) parts.push('Coverage: payment ' + out.coverage.pay + '% · emergency ' +
    out.coverage.emg + '% · licence ' + out.coverage.lic + '% · worker comp ' + out.coverage.wc + '%');
  if(out.health) parts.push('Payroll health: ' + out.health.gaps + ' of ' + out.health.scored + ' with gaps');
  if(DATA.histScope) parts.push('Historical: ' + DATA.histScope.length + ' DSPs in window');
  parts.push('Audit: 14 clients');
  document.getElementById('sidebar-foot').innerHTML = parts.join('<br>');
}

(function(){
  const items = document.querySelectorAll('.uzio-sidebar-x__item[data-view]');
  const title = document.getElementById('header-title');

  /* `client` is a sub-page of Overview: it has no sidebar entry of its own, so
     the Overview item stays lit while you're on it. */
  window.showView = function(view, headerText){
    document.querySelectorAll('.app-view').forEach(v => v.classList.remove('is-active'));
    document.getElementById('view-' + view).classList.add('is-active');
    const navFor = view === 'client' ? CLIENT_ORIGIN : view;
    items.forEach(i => i.classList.toggle('uzio-sidebar-x__item--active', i.dataset.view === navFor));
    const active = Array.from(items).find(i => i.dataset.view === navFor);
    title.textContent = headerText || (active ? active.dataset.title : '');
    window.scrollTo(0, 0);
  };

  items.forEach(el => el.addEventListener('click', () => showView(el.dataset.view)));
  document.getElementById('client-back').addEventListener('click', () => showView(CLIENT_ORIGIN));
})();

loadAll();
</script>
