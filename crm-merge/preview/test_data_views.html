<!doctype html>
<!-- Local harness for views-data.js: real CRM styles, real data (fixture.js
     dumped from our Supabase), Store stubbed — no login, no network. Serves
     only to eyeball the four tabs before the code goes into the CRM repo. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>views-data.js harness</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" style="display:flex">
  <nav id="nav">
    <div class="brand">DSP CRM (harness)</div>
    <div id="nav-items"><a href="#data" data-nav="data" class="active">Data</a></div>
  </nav>
  <main id="view"></main>
</div>
<script src="fixture.js"></script>
<script>
/* Just enough of app.js/store.js for views-data.js to run. */
const $ = (s) => document.querySelector(s);
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(d) { return d || "—"; }
window.Store = {
  listApiActivity:       async () => FIXTURE.api_activity_runs,
  listPayrollHealth:     async () => FIXTURE.payroll_health,
  listDataCoverage:      async () => FIXTURE.client_data_coverage,
  listDocumentTransfers: async () => FIXTURE.document_transfer,
  listDocumentCounts:    async () => FIXTURE.client_document_counts,
  listHistClients:       async () => FIXTURE.hist_clients,
  listHistStatus:        async () => FIXTURE.hist_status,
  listHistOutOfScope:    async () => FIXTURE.hist_out_of_scope,
  getPlatformBundle:     async (code) => {
    const one = (t) => (FIXTURE[t] || []).find((r) => r.dsp_short_code === code) || null;
    const all = (t) => (FIXTURE[t] || []).filter((r) => r.dsp_short_code === code);
    const profile = one("client_profile"), cov = one("client_data_coverage"), sys = one("client_system_activity");
    const fein = profile?.fein || cov?.fein || sys?.fein || null;
    return { profile, sys, cov, locs: all("client_work_locations"),
      docs: one("client_document_counts"), health: one("payroll_health"),
      hist: one("hist_clients"),
      histPend: all("hist_status").filter((r) => r.status === "Pending"),
      api: (FIXTURE.api_activity_runs || []).filter((r) => r.fein === fein),
      transfers: FIXTURE.document_transfer || [], fein };
  },
};
</script>
<script src="../crm-site/views-data.js"></script>
<script>
const route = () => {
  const [name, arg] = location.hash.replace(/^#/, "").split("/");
  if (name === "detail") {   // #detail/<CODE> exercises the Client 360 platform panel
    const p = (FIXTURE.client_profile || []).find((r) => r.dsp_short_code === arg) || {};
    $("#view").innerHTML = `<div class="page-head"><h1>${esc(p.dsp_name || arg)} <span class="muted">${esc(arg)}</span></h1></div>
      <div id="cd-platform"><p class="muted">Loading platform data…</p></div>`;
    loadPlatformPanel({ short_code: arg, dsp_name: p.dsp_name || arg });
    return;
  }
  Views.renderData($("#view"), arg).catch((e) => {
    $("#view").innerHTML = "<pre style='color:red'>" + esc(e.stack) + "</pre>";
  });
};
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
