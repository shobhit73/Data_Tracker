@media (prefers-color-scheme: dark){
  :root{
    --uzio-color-bg-page:#15191c; --uzio-color-bg-card:#1e2429; --uzio-color-bg-table-head:#232a30;
    --uzio-color-bg-row-hover:#262e35; --uzio-color-bg-subtle:#232a30;
    --uzio-color-border:#333d45; --uzio-color-border-light:#2b333a; --uzio-color-divider:#272f36;
    --uzio-color-text-heading:#eef1f3; --uzio-color-text-body:#c3cad0; --uzio-color-text-muted:#8b969f;
    --uzio-color-text-faint:#69747d;
    --uzio-color-info-bg:#16323f; --uzio-color-info-border:#245b70; --uzio-color-info-text:#9fd4e8;
  }
}
:root[data-theme="dark"]{
  --uzio-color-bg-page:#15191c; --uzio-color-bg-card:#1e2429; --uzio-color-bg-table-head:#232a30;
  --uzio-color-bg-row-hover:#262e35; --uzio-color-bg-subtle:#232a30;
  --uzio-color-border:#333d45; --uzio-color-border-light:#2b333a; --uzio-color-divider:#272f36;
  --uzio-color-text-heading:#eef1f3; --uzio-color-text-body:#c3cad0; --uzio-color-text-muted:#8b969f;
  --uzio-color-text-faint:#69747d;
  --uzio-color-info-bg:#16323f; --uzio-color-info-border:#245b70; --uzio-color-info-text:#9fd4e8;
}
:root[data-theme="light"]{
  --uzio-color-bg-page:#f1eee7; --uzio-color-bg-card:#ffffff; --uzio-color-bg-table-head:#f8fafc;
  --uzio-color-bg-row-hover:#f4f7fa; --uzio-color-bg-subtle:#f8fafc;
  --uzio-color-border:#D0DBE3; --uzio-color-border-light:#e5eaef; --uzio-color-divider:#eef2f6;
  --uzio-color-text-heading:#23272A; --uzio-color-text-body:#44494E; --uzio-color-text-muted:#6b7280;

  --uzio-color-info-bg:#d9edf7; --uzio-color-info-border:#98d6ea; --uzio-color-info-text:#31708f;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--uzio-font-family);font-size:14px;line-height:20px;
  color:var(--uzio-color-text-body);background:var(--uzio-color-bg-page);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{margin:0;color:var(--uzio-color-text-heading)}
.tnum{font-variant-numeric:tabular-nums}
.nil{color:var(--uzio-color-text-faint)}

.uzio-icon{display:inline-block;width:24px;height:24px;background-color:currentColor;
  -webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:contain;mask-size:contain;flex-shrink:0}
.uzio-icon--sm{width:18px;height:18px}
.uzio-icon--dashboard{-webkit-mask-image:var(--uzio-icon-dashboard);mask-image:var(--uzio-icon-dashboard)}
.uzio-icon--file{-webkit-mask-image:var(--uzio-icon-file);mask-image:var(--uzio-icon-file)}
.uzio-icon--hr-compliance{-webkit-mask-image:var(--uzio-icon-hr-compliance);mask-image:var(--uzio-icon-hr-compliance)}
.uzio-icon--task{-webkit-mask-image:var(--uzio-icon-task);mask-image:var(--uzio-icon-task)}
.uzio-icon--alert-bulb{-webkit-mask-image:var(--uzio-icon-alert-bulb);mask-image:var(--uzio-icon-alert-bulb)}
.uzio-icon--help{-webkit-mask-image:var(--uzio-icon-help);mask-image:var(--uzio-icon-help)}
.uzio-icon--transfer{-webkit-mask-image:var(--uzio-icon-transfer);mask-image:var(--uzio-icon-transfer)}

/* ---------- shell ---------- */
.uzio-sidebar-x{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--uzio-color-nav);
  color:var(--uzio-color-text-white);padding:16px 0;z-index:11;display:flex;flex-direction:column;overflow-y:auto}
.uzio-sidebar-x__brand{padding:0 20px 18px;font-size:17px;font-weight:700;letter-spacing:1px;color:var(--uzio-color-action)}
.uzio-sidebar-x__brand span{color:#fff;font-weight:400;opacity:.7;font-size:12px;letter-spacing:.4px;display:block;margin-top:2px}
.uzio-sidebar-x__item{display:flex;align-items:center;gap:12px;padding:10px 16px;color:rgba(255,255,255,.85);
  font-size:14px;cursor:pointer;border:none;border-left:3px solid transparent;background:none;width:100%;
  text-align:left;font-family:inherit;transition:background var(--uzio-motion-base)}
.uzio-sidebar-x__item:hover{background:rgba(255,255,255,.06);color:#fff}
.uzio-sidebar-x__item--active{background:rgba(11,152,216,.15);color:#fff;border-left-color:var(--uzio-color-action);font-weight:600}
.uzio-sidebar-x__foot{margin-top:auto;padding:14px 20px 4px;font-size:11px;line-height:1.6;
  color:rgba(255,255,255,.45);border-top:1px solid rgba(255,255,255,.08)}

.uzio-header{position:fixed;top:0;left:240px;right:0;height:64px;background:var(--uzio-color-bg-card);
  border-bottom:1px solid var(--uzio-color-border);display:flex;align-items:center;padding:0 28px;z-index:10}
.uzio-header__title{font-size:15px;font-weight:700;color:var(--uzio-color-text-heading)}
.uzio-header__spacer{flex:1}
.uzio-header__icons{display:flex;align-items:center;gap:16px;color:var(--uzio-color-text-muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.uzio-avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:50%;background:var(--uzio-color-action);color:#fff;font-weight:600;font-size:13px}

.uzio-app-stage{padding:104px 32px 40px 272px;max-width:1720px}
.uzio-page-title{font-size:30px;font-weight:400;line-height:38px;color:var(--uzio-color-text-heading);margin:0 0 4px}
.app-view{display:none}
.app-view.is-active{display:block}

@media (max-width:1180px){
  .uzio-sidebar-x{width:64px;padding:16px 0}
  .uzio-sidebar-x__brand{padding:0 0 18px;text-align:center;font-size:13px}
  .uzio-sidebar-x__brand span{display:none}
  .uzio-sidebar-x__item{justify-content:center;padding:12px 0;gap:0;border-left-width:2px}
  .nav-label,.uzio-sidebar-x__foot{display:none}
  .uzio-header{left:64px;padding:0 18px}
  .uzio-app-stage{padding:96px 20px 40px 88px}
  .uzio-page-title{font-size:24px;line-height:30px}
}
@media (max-width:700px){
  .uzio-app-stage{padding:92px 14px 32px 78px}
}

/* ---------- breadcrumb (sub-pages only) ---------- */
.uzio-breadcrumb{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:none;border:none;
  font-family:inherit;padding:0;margin:0 0 10px}
.uzio-breadcrumb__arrow{color:var(--uzio-color-text-muted);font-size:15px;line-height:1}
.uzio-breadcrumb__label{color:var(--uzio-color-action);font-size:13px;font-weight:600}
.uzio-breadcrumb:hover .uzio-breadcrumb__label{text-decoration:underline}
.uzio-breadcrumb:focus-visible{outline:2px solid var(--uzio-color-action);outline-offset:3px}

/* ---------- pagination ---------- */
.pager{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--uzio-color-text-muted)}
.pager__btn{height:28px;min-width:30px;padding:0 10px;border:1px solid var(--uzio-color-border);
  background:var(--uzio-color-bg-card);border-radius:var(--uzio-radius-sm);cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--uzio-color-text-body)}
.pager__btn:disabled{opacity:.4;cursor:default}
.pager__btn:not(:disabled):hover{border-color:var(--uzio-color-action);color:var(--uzio-color-action)}
.pager__info{font-variant-numeric:tabular-nums}
.pager__size{margin-left:auto;display:flex;align-items:center;gap:6px}

/* ---------- data coverage ---------- */
.cov-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:18px}
.cov-metric{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-lg);padding:16px 18px;text-align:left;cursor:pointer;font:inherit;
  transition:border-color var(--uzio-motion-base),box-shadow var(--uzio-motion-base)}
.cov-metric:hover{border-color:var(--uzio-color-action)}
.cov-metric.is-active{border-color:var(--uzio-color-action);
  box-shadow:inset 0 0 0 1px var(--uzio-color-action)}
.cov-metric__label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--uzio-color-text-muted);margin-bottom:9px}
.cov-metric__pct{font-size:30px;font-weight:700;color:var(--uzio-color-text-heading);line-height:1;
  margin-bottom:10px}
.cov-metric__sub{font-size:11.5px;color:var(--uzio-color-text-muted);margin-top:9px;line-height:1.55}
/* Chip rows get a leading label so it is obvious that each row is its own
   question — an unlabelled run of chips reads as one long undifferentiated set. */
.filter-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.filter-row__label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--uzio-color-text-muted)}
.cov-cell{min-width:118px}
.cov-cell__pct{font-size:14px;font-weight:600;color:var(--uzio-color-text-heading);margin-bottom:5px}
.cov-cell__gap{font-size:11px;color:var(--uzio-color-text-muted);margin-top:5px}
/* A client with nothing at all is a different problem from one that is merely
   behind, so it gets an edge marker rather than just a shorter bar. */
tr.cov-none td:first-child{box-shadow:inset 3px 0 0 var(--uzio-color-error)}
.cov-foot{font-size:11.5px;color:var(--uzio-color-text-muted);margin-top:12px}
.open-meta{display:inline-flex;gap:6px;align-items:center;margin-left:9px;vertical-align:middle}
.open-meta .uzio-status{font-size:10.5px}
.audit-card__link{margin-top:9px;font-size:11.5px}
.audit-card__link a{color:var(--uzio-color-action);text-decoration:none;font-weight:600}
.audit-card__link a:hover{text-decoration:underline}
.audit-card__link--none{color:var(--uzio-color-text-faint)}
.bots-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  font-size:12px;color:var(--uzio-color-text-muted)}
.bots-bar a{color:var(--uzio-color-action);text-decoration:none;font-weight:600}
.bots-bar a:hover{text-decoration:underline}
/* ---------- load history (expanded row) ---------- */
tr.cov-row{cursor:pointer}
tr.cov-row:hover{background:var(--uzio-color-bg-row-hover)}
.cov-tl__head{font-size:12.5px;color:var(--uzio-color-text-body);line-height:1.7;margin-bottom:14px}
.cov-tl__head b{color:var(--uzio-color-text-heading)}
/* Taller than it looks like it needs to be: the gap between a 1-person day and
   a 258-person day is the whole point of the chart, and 120px could not hold
   it. padding-top leaves room for the value printed above the tallest bars. */
.cov-tl__chart{display:flex;align-items:flex-end;gap:4px;height:168px;overflow-x:auto;
  padding:18px 0 2px}
.cov-tl__slot{display:flex;align-items:flex-end;gap:2px;height:100%;flex:0 0 auto;cursor:default}
.cov-tl__bar{position:relative;width:13px;min-height:3px;border-radius:2px 2px 0 0}
.cov-tl__val{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;
  font-size:10px;font-weight:700;color:var(--uzio-color-text-heading);white-space:nowrap}
/* Colour carries the "who": one glance separates a staff bulk load from the
   client adding people one at a time. */
.cov-tl__bar--staff{background:var(--uzio-color-action)}
.cov-tl__bar--client{background:var(--uzio-color-orange)}
.cov-tl__bar--system{background:var(--uzio-color-success)}
.cov-tl__bar--term{width:8px;background:var(--uzio-color-error);opacity:.7}
.cov-tl__legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;
  color:var(--uzio-color-text-muted)}
.cov-tl__key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.cov-tl__axis{display:flex;justify-content:space-between;gap:4px;margin-top:6px;font-size:10.5px;
  color:var(--uzio-color-text-faint)}
.cov-tl__empty{font-size:12.5px;color:var(--uzio-color-text-muted)}

/* ---------- sortable headers ---------- */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--uzio-color-action)}
th.sortable::after{content:'⇅';margin-left:5px;opacity:.35;font-size:10px}
th.sortable.sort-asc::after{content:'↑';opacity:1;color:var(--uzio-color-action)}
th.sortable.sort-desc::after{content:'↓';opacity:1;color:var(--uzio-color-action)}

/* ---------- date-range filter ---------- */
.date-filter{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--uzio-color-text-muted)}
.date-filter select,.date-filter input{height:32px;border:1px solid var(--uzio-color-border);
  border-radius:var(--uzio-radius-sm);background:var(--uzio-color-bg-card);font-family:inherit;
  font-size:12.5px;color:var(--uzio-color-text-heading);padding:0 8px}
.date-filter select:focus,.date-filter input:focus{outline:2px solid var(--uzio-color-action);outline-offset:-1px}

/* ---------- clickable rows ---------- */
tr.row-link{cursor:pointer}
tr.row-link:hover .name-cell b{color:var(--uzio-color-action);text-decoration:underline}
tr.row-link:focus-visible{outline:2px solid var(--uzio-color-action);outline-offset:-2px}

/* ---------- client detail ---------- */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.detail-card{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-lg);padding:18px 20px}
.detail-card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--uzio-color-text-muted);margin:0 0 12px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
  border-top:1px solid var(--uzio-color-divider);font-size:13px}
.kv:first-of-type{border-top:none}
.kv dt{color:var(--uzio-color-text-muted);flex-shrink:0}
.kv dd{margin:0;font-weight:600;color:var(--uzio-color-text-heading);text-align:right;word-break:break-word}
.loc-row{border-top:1px solid var(--uzio-color-divider);padding:11px 0}
.loc-row:first-of-type{border-top:none;padding-top:0}
.loc-row__name{font-weight:700;font-size:13px;color:var(--uzio-color-text-heading);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.loc-row__addr{font-size:12.5px;color:var(--uzio-color-text-muted);margin-top:3px;line-height:1.5}

/* ---------- filters ---------- */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.uzio-search{position:relative;display:flex;align-items:center;width:260px}
.uzio-search__icon{position:absolute;left:10px;font-size:14px;color:var(--uzio-color-text-faint);pointer-events:none}
.uzio-search__input{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--uzio-color-border);
  border-radius:var(--uzio-radius-sm);font-family:inherit;font-size:13px;color:var(--uzio-color-text-heading);
  background:var(--uzio-color-bg-card)}
.uzio-search__input:focus{outline:2px solid var(--uzio-color-action);outline-offset:-1px;border-color:transparent}
.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.uzio-filter-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;cursor:pointer;
  border-radius:var(--uzio-radius-pill);border:1px solid var(--uzio-color-border);background:var(--uzio-color-bg-card);
  font-size:12px;font-weight:500;color:var(--uzio-color-text-body);font-family:inherit;
  transition:background var(--uzio-motion-base),color var(--uzio-motion-base)}
.uzio-filter-chip:hover{border-color:var(--uzio-color-action)}
.uzio-filter-chip:focus-visible{outline:2px solid var(--uzio-color-action);outline-offset:2px}
.uzio-filter-chip.is-active{background:var(--uzio-color-action);color:#fff;border-color:var(--uzio-color-action);font-weight:700}
.uzio-filter-chip.is-active .uzio-filter-chip__dot{background:#fff!important}
.uzio-filter-chip__dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--uzio-color-text-body);cursor:pointer;user-select:none}
.result-count{margin-left:auto;font-size:12px;color:var(--uzio-color-text-muted);font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.table-shell{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-lg);overflow:auto;max-height:calc(100vh - 300px)}
.table-shell--short{max-height:calc(100vh - 260px)}
.uzio-table{width:100%;border-collapse:separate;border-spacing:0}
.uzio-table th{text-align:left;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.3px;
  color:var(--uzio-color-text-muted);background:var(--uzio-color-bg-table-head);
  border-bottom:1px solid var(--uzio-color-border-light);position:sticky;top:0;z-index:2;white-space:nowrap}
.uzio-table td{padding:9px 14px;font-size:13.5px;line-height:1.35;color:var(--uzio-color-text-heading);
  border-bottom:1px solid var(--uzio-color-divider);vertical-align:middle}
.uzio-table tbody tr:last-child td{border-bottom:none}
.uzio-table tbody tr:hover td{background:var(--uzio-color-bg-row-hover)}
.name-cell b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:10.5px;color:var(--uzio-color-text-faint);margin-top:2px;font-weight:400;letter-spacing:.3px}
.fein{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--uzio-color-text-muted)}

/* Overview grid: fixed layout so the DSP column can't hog width and push the last
   two columns out of the shell. Percentages sum to 100; narrow columns hold their
   content on one line so rows stay a uniform height. */
#ovTable{table-layout:fixed}
#ovTable th,#ovTable td{overflow:hidden;text-overflow:ellipsis}
#ovTable th:nth-child(1),#ovTable td:nth-child(1){width:25%}
#ovTable th:nth-child(2),#ovTable td:nth-child(2){width:8%;white-space:nowrap}
#ovTable th:nth-child(3),#ovTable td:nth-child(3){width:9%;white-space:nowrap}
#ovTable th:nth-child(4),#ovTable td:nth-child(4){width:16%;font-size:12.5px;line-height:1.35}
#ovTable th:nth-child(5),#ovTable td:nth-child(5){width:9%;white-space:nowrap}
#ovTable th:nth-child(6),#ovTable td:nth-child(6){width:10%;white-space:nowrap}
#ovTable th:nth-child(7),#ovTable td:nth-child(7){width:14%;white-space:nowrap}
#ovTable th:nth-child(8),#ovTable td:nth-child(8){width:9%;white-space:nowrap}
@media (max-width:1180px){
  /* below the breakpoint there isn't room for 8 columns — drop the two the eye
     scans least, rather than letting everything squeeze into unreadable slivers */
  #ovTable th:nth-child(7),#ovTable td:nth-child(7),
  #ovTable th:nth-child(8),#ovTable td:nth-child(8){display:none}
  #ovTable th:nth-child(1),#ovTable td:nth-child(1){width:34%}
  #ovTable th:nth-child(4),#ovTable td:nth-child(4){width:22%}
}

.matrix-table{min-width:max-content}
.matrix-table th,.matrix-table td{white-space:nowrap;padding:8px 10px}
.matrix-table .sticky-col{position:sticky;left:0;background:var(--uzio-color-bg-table-head);z-index:1;
  text-align:left;font-weight:700;font-size:12.5px;border-right:1px solid var(--uzio-color-border-light)}
.matrix-table thead .sticky-col{z-index:4}
.matrix-table thead th{z-index:3}
.mcell{text-align:center}
.matrix-table th.is-hidden,.matrix-table td.is-hidden{display:none}

/* ---------- status ---------- */
.uzio-status{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--uzio-radius-pill);
  font-size:11.5px;font-weight:700;line-height:18px;white-space:nowrap}
.uzio-status--success{color:var(--uzio-color-success);background:var(--uzio-color-success-bg)}
.uzio-status--error{color:var(--uzio-color-error);background:var(--uzio-color-error-bg)}
.uzio-status--warning{color:var(--uzio-color-warning);background:var(--uzio-color-warning-bg)}
.uzio-status--neutral{color:var(--uzio-color-text-muted);background:var(--uzio-color-bg-subtle)}

/* ---------- historical coverage ---------- */
.hist-client{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-md);margin-bottom:10px;overflow:hidden}
/* Grid, not flex: the columns must line up down the list, otherwise the vendor
   chip and the date drift left and right with the length of each client name. */
.hist-head{display:grid;grid-template-columns:12px minmax(0,1fr) 62px 116px 170px 150px 92px;
  align-items:center;gap:12px;width:100%;padding:12px 16px;cursor:pointer;
  font-family:inherit;text-align:left;color:inherit}
.hist-head .uzio-status:first-of-type{justify-self:start}
/* A client whose old platform can no longer be reached is not "behind", it is
   finished-by-force. Fading the row stops unreachable work reading as a to-do. */
.hist-client[data-access="blocked"] .hist-head__name,
.hist-client[data-access="blocked"] .hist-head__meta{opacity:.62}
.hist-head:hover{background:var(--uzio-color-bg-row-hover)}
.hist-head:focus-visible{outline:2px solid var(--uzio-color-action);outline-offset:-2px}
.hist-head__caret{color:var(--uzio-color-text-faint);font-size:11px;
  transition:transform var(--uzio-motion-base);line-height:1}
.hist-client.is-open .hist-head__caret{transform:rotate(90deg)}
.hist-head__name{font-weight:700;font-size:13.5px;color:var(--uzio-color-text-heading);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-head .uzio-chip{justify-self:start}
.hist-head__meta{font-size:11.5px;color:var(--uzio-color-text-faint);white-space:nowrap}
.hist-head__bar{width:100%}
.hist-head .uzio-status{justify-self:end}
@media (max-width:1100px){
  /* Not enough room for six columns — drop the two that are context rather
     than status, keeping the name, the bar and the count. */
  .hist-head{grid-template-columns:12px minmax(0,1fr) 62px 116px 90px}
  .hist-head__meta,.hist-head__bar{display:none}
}
/* Marks a mail-reported total that does not agree with the row count. Both
   numbers stay on screen — which one is right is not for the page to decide. */
.doc-mismatch{color:var(--uzio-color-warning);font-weight:700;
  text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
.detail-access{display:flex;align-items:flex-start;gap:9px;margin-bottom:12px;
  font-size:12px;line-height:1.6;color:var(--uzio-color-text-body)}
.detail-access b{color:var(--uzio-color-text-heading)}
.detail-access .uzio-status{flex:0 0 auto;margin-top:1px}
.hist-body{display:none;padding:2px 16px 16px;border-top:1px solid var(--uzio-color-divider)}
.hist-client.is-open .hist-body{display:block}
.hist-cat{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--uzio-color-text-muted);margin:14px 0 6px}
.hist-row{display:flex;align-items:flex-start;gap:12px;padding:7px 0;
  border-top:1px solid var(--uzio-color-divider);font-size:13px}
.hist-row:first-of-type{border-top:none}
.hist-row__name{flex:1;min-width:0;color:var(--uzio-color-text-heading)}
.hist-row__range{font-size:11px;color:var(--uzio-color-text-faint);margin-top:2px}
.hist-row__units{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex-shrink:0;max-width:58%}
.unit-pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--uzio-radius-sm);white-space:nowrap}
.unit-pill--yes{color:var(--uzio-color-success);background:var(--uzio-color-success-bg)}
.unit-pill--no{color:var(--uzio-color-error);background:var(--uzio-color-error-bg)}
.unit-pill--na{color:var(--uzio-color-text-muted);background:var(--uzio-color-bg-subtle)}
.unit-pill--link{text-decoration:none;cursor:pointer}
.unit-pill--link:hover{outline:1px solid currentColor}
.hist-head__drive{font-size:11px;font-weight:700;color:var(--uzio-color-action);text-decoration:none;white-space:nowrap}
.hist-head__drive:hover{text-decoration:underline}
.doc-flag{font-size:10px;font-weight:700;color:var(--uzio-color-warning);
  background:var(--uzio-color-warning-bg);padding:1px 6px;border-radius:var(--uzio-radius-sm);margin-left:6px}

/* ---------- audit cards ---------- */
.audit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.audit-card{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-md);padding:14px 16px}
.audit-card__head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.audit-card__head b{font-size:13.5px;color:var(--uzio-color-text-heading)}
.uzio-progress{width:100%;height:6px;background:var(--uzio-color-bg-subtle);border-radius:var(--uzio-radius-pill);overflow:hidden}
.uzio-progress__fill{height:100%;background:var(--uzio-color-success);transition:width var(--uzio-motion-base)}
.uzio-progress__fill--warn{background:var(--uzio-color-warning)}
.uzio-progress__fill--error{background:var(--uzio-color-error)}
.audit-card__note{font-size:11.5px;color:var(--uzio-color-text-muted);margin-top:8px;line-height:1.5}
.audit-card__cats{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.cat-pip{font-size:10.5px;padding:1px 7px;border-radius:var(--uzio-radius-sm);font-weight:600}
.cat-pip--yes{color:var(--uzio-color-success);background:var(--uzio-color-success-bg)}
.cat-pip--no{color:var(--uzio-color-error);background:var(--uzio-color-error-bg)}

/* ---------- open items ---------- */
.section-block{margin-bottom:28px}
.section-block h2{font-size:15px;font-weight:700;color:var(--uzio-color-text-heading);margin:0 0 11px;
  display:flex;align-items:center;gap:8px}
.uzio-section-label{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--uzio-color-text-muted);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.err-list{display:flex;flex-direction:column;gap:7px}
.uzio-item{display:flex;background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-sm);overflow:hidden}
.uzio-item__bar{width:3px;align-self:stretch;flex-shrink:0}
.uzio-item--critical .uzio-item__bar{background:var(--uzio-color-dot-critical)}
.uzio-item--warning .uzio-item__bar{background:var(--uzio-color-dot-warning)}
.uzio-item--alert .uzio-item__bar{background:var(--uzio-color-dot-alert)}
.uzio-item__body{flex:1;padding:11px 15px}
.uzio-item__title{font-size:13.5px;font-weight:700;color:var(--uzio-color-text-heading);margin-bottom:3px}
.uzio-item__desc{font-size:12.5px;color:var(--uzio-color-text-body);line-height:1.55}
.uzio-item__foot{margin-top:6px;font-size:11.5px;color:var(--uzio-color-text-muted)}

/* ---------- open items: add / assign / complete ---------- */
.oi-row{display:flex;align-items:flex-start;gap:12px}
.oi-row__main{flex:1;min-width:0}
.uzio-item--done{opacity:.74}
.uzio-item--done .uzio-item__title{text-decoration:line-through;
  text-decoration-color:var(--uzio-color-text-faint)}
.oi-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.oi-btn{height:32px;padding:0 14px;border-radius:var(--uzio-radius-sm);cursor:pointer;
  border:1px solid var(--uzio-color-action);background:var(--uzio-color-action);color:#fff;
  font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap}
.oi-btn:hover:not(:disabled){background:var(--uzio-color-action-hover);border-color:var(--uzio-color-action-hover)}
.oi-btn:focus-visible{outline:2px solid var(--uzio-color-action);outline-offset:2px}
.oi-btn:disabled{opacity:.55;cursor:not-allowed}
.oi-btn--ghost{background:var(--uzio-color-bg-card);color:var(--uzio-color-action)}
.oi-btn--ghost:hover:not(:disabled){background:var(--uzio-color-action-bg-soft)}
.oi-btn--mini{height:26px;padding:0 11px;font-size:11.5px;border-radius:var(--uzio-radius-pill)}
.oi-me{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:12px;
  color:var(--uzio-color-text-muted)}
.oi-form{background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);
  border-radius:var(--uzio-radius-lg);padding:16px 18px;margin-bottom:18px}
.oi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.oi-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.oi-field--wide{grid-column:1/-1}
.oi-label{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--uzio-color-text-muted)}
.oi-input,.oi-select,.oi-textarea{height:32px;padding:0 10px;font-family:inherit;font-size:13px;
  border:1px solid var(--uzio-color-border);border-radius:var(--uzio-radius-sm);
  color:var(--uzio-color-text-heading);background:var(--uzio-color-bg-card);min-width:0}
/* Native date/select widgets paint their own chrome from the OS scheme, so
   without this the picker icon goes dark-on-dark under the dark theme. */
.oi-input[type=date],.oi-select{color-scheme:light dark}
.oi-input--sm{height:28px;width:150px;font-size:12px}
/* Marks the "You are" box when a close was blocked for want of a name. The
   message alone was not enough — it sits at the far side of the panel from the
   button that was clicked. */
.oi-input--needed{border-color:var(--uzio-color-error);box-shadow:0 0 0 3px rgba(214,69,69,.18)}
.oi-textarea{height:auto;min-height:58px;padding:8px 10px;line-height:1.5;resize:vertical}
.oi-input:focus,.oi-select:focus,.oi-textarea:focus{outline:2px solid var(--uzio-color-action);
  outline-offset:-1px;border-color:transparent}
.oi-actions{display:flex;align-items:center;gap:12px;margin-top:14px}
.oi-msg{font-size:12px;font-weight:600}
.oi-msg--err{color:var(--uzio-color-error)}
.oi-msg--ok{color:var(--uzio-color-success)}
@media (max-width:720px){
  .oi-me{margin-left:0;width:100%}
  .oi-row{flex-direction:column;gap:9px}
}


.skeleton{padding:44px;text-align:center;color:var(--uzio-color-text-faint);font-size:13px;
  background:var(--uzio-color-bg-card);border:1px solid var(--uzio-color-border-light);border-radius:var(--uzio-radius-lg)}
.err-box{padding:15px;border:1px solid var(--uzio-color-error);background:var(--uzio-color-error-bg);
  color:var(--uzio-color-error);border-radius:var(--uzio-radius-sm);font-size:13px}
</style>

<script>
const SUPABASE_URL = 'https://nqiyiherkzlhorsnyeni.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xaXlpaGVya3psaG9yc255ZW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzE1OTcsImV4cCI6MjEwMjEwNzU5N30.jftJZ7FxGa-GveEAb1G-bZpxzob670Dbk1BePaqVlyQ';

const NIL = '<span class="nil">&mdash;</span>';

function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return NIL;
  return '<span class="tnum">' + fmtDatePlain(d) + '</span>';
}
/* Same date, no markup — for title attributes, where HTML would be shown
   literally rather than rendered. */
function fmtDatePlain(d){
  if(!d) return '';
  const p = d.split('-');
  return p[1] + '/' + p[2] + '/' + p[0].slice(2);
}
const DOT = {
  good: 'var(--uzio-color-success)',
  warn: 'var(--uzio-color-warning)',
  bad: 'var(--uzio-color-error)',
  info: 'var(--uzio-color-action)',
  orange: 'var(--uzio-color-orange)'
};

/* Build a filter bar. cfg = {
     search:  {id, placeholder},
     groups:  [{id, options:[{val, label, dot}]}],
     toggles: [{id, label}],
     countId
   }
   Every group's first option is the "show everything" default. */
function buildFilters(cfg){
  let h = '<div class="filter-bar">';
  if(cfg.search){
    h += '<div class="uzio-search"><span class="uzio-search__icon">&#8981;</span>' +
      '<input class="uzio-search__input" id="' + cfg.search.id + '" placeholder="' + esc(cfg.search.placeholder) +
      '" aria-label="' + esc(cfg.search.placeholder) + '"></div>';
  }
  (cfg.groups || []).forEach(g => {
    h += '<div class="chip-group" id="' + g.id + '">' + g.options.map(o =>
      '<button class="uzio-filter-chip" data-val="' + esc(o.val) + '">' +
      (o.dot ? '<span class="uzio-filter-chip__dot" style="background:' + o.dot + '"></span>' : '') +
      esc(o.label) + '</button>').join('') + '</div>';
  });
  (cfg.toggles || []).forEach(t => {
    h += '<label class="toggle"><input type="checkbox" id="' + t.id + '"> ' + esc(t.label) + '</label>';
  });
  return h + '<span class="result-count" id="' + cfg.countId + '"></span></div>';
}

/* Wire a filter bar to a list of {el, ...} records.
   `match(record, state)` returns whether the record survives; `state` holds the
   search text under `q` plus one entry per group id and toggle id. */
function wireFilters(scope, cfg, records, match, label){
  const state = { q: '' };
  (cfg.groups || []).forEach(g => { state[g.id] = g.options[0].val; });
  (cfg.toggles || []).forEach(t => { state[t.id] = false; });
  const countEl = scope.querySelector('#' + cfg.countId);

  function apply(){
    let shown = 0;
    records.forEach(rec => {
      const ok = match(rec, state);
      rec.el.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    countEl.textContent = label(shown, records.length);
  }

  if(cfg.search){
    scope.querySelector('#' + cfg.search.id).addEventListener('input', e => {
      state.q = (e.target.value || '').toLowerCase().trim();
      apply();
    });
  }
  (cfg.groups || []).forEach(g => {
    wireChips(scope.querySelector('#' + g.id), v => { state[g.id] = v; apply(); });
  });
  (cfg.toggles || []).forEach(t => {
    scope.querySelector('#' + t.id).addEventListener('change', e => {
      state[t.id] = e.target.checked;
      apply();
    });
  });
  apply();
}
// City names arrive from prod in mixed conventions — some ALL CAPS ("ROCKVILLE"),
// some already title-cased ("Meridian"). Normalise for display only.
function titleCase(s){
  return (s || '').toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
}
// The placeholder div carries .skeleton (centred text + 44px padding). It MUST be
// dropped once real content is injected, otherwise every table inherits centred
// text and the loading padding.
function panel(id){
  const el = document.getElementById(id);
  el.classList.remove('skeleton');
  return el;
}
async function sbGet(path){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
  });
  if(!res.ok) throw new Error(path.split('?')[0] + ' → HTTP ' + res.status);
  return res.json();
}
/* Writes. Only open_items accepts these — the anon key holds insert + update on
   that one table and select everywhere else, so a POST/PATCH anywhere else comes
   back 401/403 rather than quietly succeeding. Delete is not granted at all.
   Errors surface the body text: PostgREST puts the useful part (which check
   constraint failed, which column does not exist) there, not in the status. */
async function sbWrite(path, method, body){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: method,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  if(!res.ok){
    let msg = text;
    try { msg = (JSON.parse(text).message) || text; } catch(e){}
    throw new Error('HTTP ' + res.status + (msg ? ' — ' + msg : ''));
  }
  return text ? JSON.parse(text) : null;
}

/* Who is using this browser. The anon key is public and there is no login, so
   this is a self-declared name kept in localStorage, not a verified identity —
   it is what lands in completed_by when someone closes an item. Private-mode
   browsers can throw on localStorage, hence the try/catch on both sides. */
const ME_KEY = 'dspops.me';
function getMe(){ try { return (localStorage.getItem(ME_KEY) || '').trim(); } catch(e){ return ''; } }
function setMe(v){ try { localStorage.setItem(ME_KEY, v); } catch(e){} }

async function reloadOpen(){
  const rows = await sbGet('open_items?select=*&order=date_added.desc');
  DATA.open = rows;
  renderOpen(rows);
}
function wireChips(groupEl, onPick){
  const btns = Array.from(groupEl.querySelectorAll('.uzio-filter-chip'));
  btns.forEach(btn => btn.addEventListener('click', () => {
    btns.forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    onPick(btn.dataset.val);
  }));
  btns[0].classList.add('is-active');
}

/* ==================== OVERVIEW ==================== */
function statusBucket(s){
  const t = (s || '').toLowerCase();
  if(t.startsWith('live')) return 'Live';
  if(t.indexOf('progress') !== -1) return 'In progress';
  if(t.indexOf('exit') !== -1) return 'Exited';
  if(t.indexOf('handed over') !== -1) return 'Handed over';
  return 'Other';
}
// Every DSP row, keyed by short code, so the detail sub-page can look one up
// without re-fetching. DATA holds the other five datasets for the same reason.
let CLIENTS_BY_CODE = {};
const DATA = { loadEvents: {} };   // loadEvents is a per-client cache, filled on demand
const PAGE_SIZES = [25, 50, 100];

/* The five sources spell the same company differently — "InnovDel" vs
   "InnovDel Inc", "North Star Parcel" vs "North Star Parcel LLC",
   "CDC LOGISTICS, LLC" vs "CDC Logistics". Only api_activity_runs carries a
   FEIN, so everything else has to be matched on a normalised name. */
function normName(s){
  return (s || '').toUpperCase()
    .replace(/[.,]/g, ' ')
    .replace(/\b(LLC|L L C|INC|CORP|CORPORATION|CO|LTD|LP|DSP)\b/g, ' ')
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function sameClient(a, b){
  const na = normName(a), nb = normName(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  // One name may carry extra words ("Delivery", "Logistics"); treat it as the
  // same company when every token of the shorter name appears in the longer.
  const ta = na.split(' '), tb = nb.split(' ');
  const [short, long] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  if(short.length < 2) return false;
  return short.every(t => long.indexOf(t) !== -1);
}
/* Open items name the client in free text ("Spelman — Employee Contributions…"),
   so there is no field to join on. Match on the leading token of the company
   name, which is the distinctive part; require 4+ chars so a generic word can't
   sweep in unrelated items. This is a heuristic and the UI says so. */
function mentionsClient(text, name){
  const nn = normName(name);
  if(!nn) return false;
  const nt = ' ' + normName(text) + ' ';
  if(nt.indexOf(' ' + nn + ' ') !== -1) return true;
  const first = nn.split(' ')[0];
  if(first.length < 4) return false;
  return nt.indexOf(' ' + first + ' ') !== -1;
}

/* Which platform the client is migrating from, per the sheet's "Previous
   System" column. 'New' means they were on no platform at all — worth calling
   out rather than showing as a bare word, because it changes what onboarding
   work applies (no data transfer, no historical pull).

   NOTE: this is used in place of the sheet's Data Transfer (ADP)/(Paycom)
   columns, which look like a vendor flag but are not one — they are free-text
   checklists, and people write ADP-column notes for Paycom clients. Inferring
   a vendor from them disagreed with Previous System for 7 of 37 clients. */
function sourceCell(previousSystem){
  const v = (previousSystem || '').trim();
  if(!v) return NIL;
  if(v.toLowerCase() === 'new'){
    return '<span class="uzio-status uzio-status--success">New</span>';
  }
  return esc(v);
}

/* Build a date string from the LOCAL calendar parts. Do not reach for
   toISOString() here: it converts to UTC first, so local midnight on the 1st
   becomes the previous month's last day in any timezone ahead of UTC — which
   would silently shift every window by a day for anyone in IST. */
function isoLocal(dt){
  return dt.getFullYear() + '-' +
    String(dt.getMonth() + 1).padStart(2, '0') + '-' +
    String(dt.getDate()).padStart(2, '0');
}

/* Relative windows, because go-lives are tracked as "coming up next month" or
   "happened in the last month" rather than as fixed calendar dates.
   Day 0 of a month in JS gives the last day of the previous one. */
function dateWindow(kind){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  switch(kind){
    case 'last30':    return [isoLocal(new Date(y, m, d - 30)), isoLocal(new Date(y, m, d))];
    case 'thisMonth': return [isoLocal(new Date(y, m, 1)),      isoLocal(new Date(y, m + 1, 0))];
    case 'next30':    return [isoLocal(new Date(y, m, d)),      isoLocal(new Date(y, m, d + 30))];
    case 'nextMonth': return [isoLocal(new Date(y, m + 1, 1)),  isoLocal(new Date(y, m + 2, 0))];
    default:          return ['', ''];
  }
}

function renderOverview(rows){
  const el = panel('overview-content');
  const withFein = rows.filter(r => r.fein).length;
  CLIENTS_BY_CODE = {};
  rows.forEach(r => { CLIENTS_BY_CODE[r.dsp_short_code] = r; });

  // Location and FEIN live on the detail page now — the grid keeps only what
  // you scan across rows, and each row links through for the rest.
  const body = rows.map(r => {
    const locs = r.client_work_locations || [];
    return '<tr class="row-link" tabindex="0" data-code-raw="' + esc(r.dsp_short_code) + '"' +
      ' data-name="' + esc((r.dsp_name || '').toLowerCase()) + '"' +
      ' data-code="' + esc((r.dsp_short_code || '').toLowerCase()) + '"' +
      ' data-source="' + esc(r.previous_system || 'none') + '"' +
      ' data-bucket="' + esc(statusBucket(r.final_status)) + '"' +
      ' data-fein="' + (r.fein ? '1' : '0') + '"' +
      // FEIN is searchable even though it is no longer a visible column — it is
      // often the only identifier to hand when cross-checking against prod.
      ' data-feinval="' + esc(r.fein || '') + '"' +
      ' data-tt="' + esc(r.actual_tt_live_date || '') + '"' +
      ' data-pay="' + esc(r.payroll_live_date || '') + '">' +
      '<td class="name-cell"><b title="' + esc(r.dsp_name) + '">' + esc(r.dsp_name) + '</b>' +
        '<div class="sub">' + esc(r.dsp_short_code) +
        (locs.length ? ' &middot; ' + locs.length + ' location' + (locs.length > 1 ? 's' : '') : '') + '</div></td>' +
      '<td>' + sourceCell(r.previous_system) + '</td>' +
      '<td>' + (r.final_status ? esc(r.final_status) : NIL) + '</td>' +
      '<td>' + fmtDate(r.actual_tt_live_date) + '</td>' +
      '<td>' + fmtDate(r.payroll_live_date) + '</td>' +
    '</tr>';
  }).join('');

  el.innerHTML =
    '<div class="filter-bar">' +
      '<div class="uzio-search"><span class="uzio-search__icon">&#8981;</span>' +
        '<input class="uzio-search__input" id="ovSearch" placeholder="Search name, code or FEIN…" aria-label="Search DSPs by name, short code or FEIN"></div>' +
      '<div class="chip-group" id="ovStatus">' +
        '<button class="uzio-filter-chip" data-val="all">Any status</button>' +
        '<button class="uzio-filter-chip" data-val="Live"><span class="uzio-filter-chip__dot" style="background:' + DOT.good + '"></span>Live</button>' +
        '<button class="uzio-filter-chip" data-val="In progress"><span class="uzio-filter-chip__dot" style="background:' + DOT.warn + '"></span>In progress</button>' +
        '<button class="uzio-filter-chip" data-val="Handed over">Handed over</button>' +
        '<button class="uzio-filter-chip" data-val="Exited"><span class="uzio-filter-chip__dot" style="background:' + DOT.bad + '"></span>Exited</button>' +
      '</div>' +
      '<div class="chip-group" id="ovSource">' +
        '<button class="uzio-filter-chip" data-val="all">Any source</button>' +
        '<button class="uzio-filter-chip" data-val="ADP"><span class="uzio-filter-chip__dot" style="background:' + DOT.info + '"></span>ADP</button>' +
        '<button class="uzio-filter-chip" data-val="Paycom"><span class="uzio-filter-chip__dot" style="background:' + DOT.orange + '"></span>Paycom</button>' +
        '<button class="uzio-filter-chip" data-val="New"><span class="uzio-filter-chip__dot" style="background:' + DOT.good + '"></span>New</button>' +
      '</div>' +
      '<label class="toggle"><input type="checkbox" id="ovNoFein"> Not matched to prod</label>' +
    '</div>' +
    '<div class="filter-bar">' +
      '<div class="date-filter">' +
        '<select id="ovDateField" aria-label="Which date to filter on">' +
          '<option value="either">TT or Payroll live</option>' +
          '<option value="tt">TT live only</option>' +
          '<option value="pay">Payroll live only</option>' +
        '</select>' +
      '</div>' +
      '<div class="chip-group" id="ovWhen">' +
        '<button class="uzio-filter-chip" data-val="any">Any time</button>' +
        '<button class="uzio-filter-chip" data-val="last30">Last 30 days</button>' +
        '<button class="uzio-filter-chip" data-val="thisMonth">This month</button>' +
        '<button class="uzio-filter-chip" data-val="next30">Next 30 days</button>' +
        '<button class="uzio-filter-chip" data-val="nextMonth">Next month</button>' +
      '</div>' +
      '<div class="date-filter">' +
        '<input type="date" id="ovDateFrom" aria-label="From date">' +
        '<span>to</span><input type="date" id="ovDateTo" aria-label="To date">' +
      '</div>' +
      '<span class="result-count" id="ovCount"></span>' +
    '</div>' +
    '<div class="table-shell"><table class="uzio-table" id="ovTable">' +
      '<thead><tr><th>DSP</th><th>Source</th><th>Final status</th>' +
      '<th class="sortable" data-sort="tt">TT live</th>' +
      '<th class="sortable" data-sort="pay">Payroll live</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div>' +
    '<div class="pager">' +
      '<button class="pager__btn" id="ovFirst" type="button">&laquo;</button>' +
      '<button class="pager__btn" id="ovPrev" type="button">Prev</button>' +
      '<span class="pager__info" id="ovPageInfo"></span>' +
      '<button class="pager__btn" id="ovNext" type="button">Next</button>' +
      '<button class="pager__btn" id="ovLast" type="button">&raquo;</button>' +
      '<span class="pager__size">Rows <select id="ovPageSize" aria-label="Rows per page">' +
        PAGE_SIZES.map(n => '<option value="' + n + '">' + n + '</option>').join('') +
      '</select></span>' +
    '</div>';

  const tbody = el.querySelector('#ovTable tbody');
  const records = Array.from(tbody.querySelectorAll('tr')).map(tr => ({
    el: tr,
    code: tr.dataset.code,
    codeRaw: tr.dataset.codeRaw,
    name: tr.dataset.name,
    bucket: tr.dataset.bucket,
    source: tr.dataset.source,
    hasFein: tr.dataset.fein === '1',
    fein: tr.dataset.feinval,
    tt: tr.dataset.tt,
    pay: tr.dataset.pay
  }));

  const state = {
    q: '', status: 'all', source: 'all', noFein: false,
    dateField: 'either', from: '', to: '',
    sortKey: null, sortDir: 'asc',
    page: 0, pageSize: PAGE_SIZES[0]
  };
  const $ = (sel) => el.querySelector(sel);

  function matches(r){
    if(state.q){
      // FEINs get written with dashes as often as without, so compare digits
      // only — but guard on the query actually having digits, because
      // ''.indexOf('') is 0 and would make every row match a text search.
      const qDigits = state.q.replace(/\D/g, '');
      const hit = r.name.indexOf(state.q) !== -1
        || r.code.indexOf(state.q) !== -1
        || (qDigits.length > 0 && r.fein.replace(/\D/g, '').indexOf(qDigits) !== -1);
      if(!hit) return false;
    }
    if(state.status !== 'all' && r.bucket !== state.status) return false;
    if(state.source !== 'all' && r.source !== state.source) return false;
    if(state.noFein && r.hasFein) return false;
    if(state.from || state.to){
      // 'either' means the DSP shows up if EITHER go-live date lands in the
      // window — that's how the team asks the question ("kiski TT ya payroll
      // date agle mahine hai"), not one field at a time.
      const fields = state.dateField === 'either' ? ['tt', 'pay'] : [state.dateField];
      const hit = fields.some(f => {
        const d = r[f];
        if(!d) return false;                       // no date can't land in a window
        if(state.from && d < state.from) return false;
        if(state.to && d > state.to) return false;
        return true;
      });
      if(!hit) return false;
    }
    return true;
  }

  function apply(){
    const visible = records.filter(matches);

    if(state.sortKey){
      const dir = state.sortDir === 'asc' ? 1 : -1;
      visible.sort((a, b) => {
        const av = a[state.sortKey], bv = b[state.sortKey];
        // Blank dates always sink to the bottom, whichever way the column sorts.
        if(!av && !bv) return 0;
        if(!av) return 1;
        if(!bv) return -1;
        return av < bv ? -dir : av > bv ? dir : 0;
      });
      visible.forEach(r => tbody.appendChild(r.el));
    }

    const pages = Math.max(1, Math.ceil(visible.length / state.pageSize));
    if(state.page > pages - 1) state.page = pages - 1;
    const start = state.page * state.pageSize;
    const slice = new Set(visible.slice(start, start + state.pageSize));

    records.forEach(r => { r.el.style.display = slice.has(r) ? '' : 'none'; });

    $('#ovCount').textContent = visible.length + ' of ' + records.length + ' DSPs';
    $('#ovPageInfo').textContent = visible.length
      ? (start + 1) + '–' + Math.min(start + state.pageSize, visible.length) + ' of ' + visible.length
      : 'No matches';
    $('#ovFirst').disabled = $('#ovPrev').disabled = state.page === 0;
    $('#ovNext').disabled = $('#ovLast').disabled = state.page >= pages - 1;
  }

  $('#ovSearch').addEventListener('input', e => {
    state.q = (e.target.value || '').toLowerCase().trim(); state.page = 0; apply();
  });
  $('#ovNoFein').addEventListener('change', e => { state.noFein = e.target.checked; state.page = 0; apply(); });
  wireChips($('#ovStatus'), v => { state.status = v; state.page = 0; apply(); });
  wireChips($('#ovSource'), v => { state.source = v; state.page = 0; apply(); });

  $('#ovDateField').addEventListener('change', e => { state.dateField = e.target.value; state.page = 0; apply(); });

  // Picking a window fills the two date boxes, so the resolved dates stay
  // visible instead of the filter being an opaque "next month".
  wireChips($('#ovWhen'), kind => {
    const [from, to] = dateWindow(kind);
    state.from = from; state.to = to;
    $('#ovDateFrom').value = from;
    $('#ovDateTo').value = to;
    state.page = 0;
    apply();
  });

  // Land on the current month rather than all 99 DSPs: the page is used to see
  // who is going live now, and the full list is one chip away.
  setDefaultWindow('thisMonth');
  function setDefaultWindow(kind){
    const [from, to] = dateWindow(kind);
    state.from = from; state.to = to;
    $('#ovDateFrom').value = from;
    $('#ovDateTo').value = to;
    $('#ovWhen').querySelectorAll('.uzio-filter-chip').forEach(c =>
      c.classList.toggle('is-active', c.dataset.val === kind));
  }

  // Typing your own dates is still allowed; it just stops claiming to be one
  // of the presets.
  const onManualDate = () => {
    state.from = $('#ovDateFrom').value;
    state.to = $('#ovDateTo').value;
    $('#ovWhen').querySelectorAll('.uzio-filter-chip').forEach(c => c.classList.remove('is-active'));
    state.page = 0;
    apply();
  };
  $('#ovDateFrom').addEventListener('change', onManualDate);
  $('#ovDateTo').addEventListener('change', onManualDate);

  el.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
    const key = th.dataset.sort;
    state.sortDir = (state.sortKey === key && state.sortDir === 'asc') ? 'desc' : 'asc';
    state.sortKey = key;
    el.querySelectorAll('th.sortable').forEach(o => o.classList.remove('sort-asc', 'sort-desc'));
    th.classList.add(state.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    state.page = 0;
    apply();
  }));

  $('#ovFirst').addEventListener('click', () => { state.page = 0; apply(); });
  $('#ovPrev').addEventListener('click', () => { state.page = Math.max(0, state.page - 1); apply(); });
  $('#ovNext').addEventListener('click', () => { state.page++; apply(); });
  $('#ovLast').addEventListener('click', () => { state.page = 1e9; apply(); });
  $('#ovPageSize').addEventListener('change', e => {
    state.pageSize = Number(e.target.value); state.page = 0; apply();
  });

  const open = (tr) => showClient(tr.dataset.codeRaw);
  tbody.addEventListener('click', e => {
    const tr = e.target.closest('tr.row-link');
    if(tr) open(tr);
  });
  tbody.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const tr = e.target.closest('tr.row-link');
    if(tr){ e.preventDefault(); open(tr); }
  });

  apply();
  return { total: rows.length, withFein };
}

/* ==================== CLIENT DETAIL (sub-page) ==================== */
function kv(label, value){
  return '<div class="kv"><dt>' + esc(label) + '</dt><dd>' + (value == null || value === '' ? NIL : value) + '</dd></div>';
}
/* `origin` is the view to go back to. The client page is reachable from both
   Overview and Data Coverage, and a breadcrumb that always said "Client
   Overview" would send half the visitors somewhere they had not been. */
let CLIENT_ORIGIN = 'overview';
const ORIGIN_LABEL = { overview: 'Client Overview', coverage: 'Data Coverage' };

function showClient(code, origin){
  const r = CLIENTS_BY_CODE[code];
  if(!r) return;
  CLIENT_ORIGIN = origin || 'overview';
  const crumb = document.querySelector('#client-back .uzio-breadcrumb__label');
  if(crumb) crumb.textContent = ORIGIN_LABEL[CLIENT_ORIGIN] || 'Back';

  const locs = (r.client_work_locations || []).slice().sort((a, b) =>
    (b.is_primary ? 1 : 0) - (a.is_primary ? 1 : 0));

  const locHtml = locs.length ? locs.map(l => {
    const line2 = [titleCase(l.city), (l.state || '').toUpperCase(), l.zip_code].filter(Boolean).join(', ');
    const street = [l.address_line1, l.address_line2].filter(Boolean).join(', ');
    return '<div class="loc-row"><div class="loc-row__name">' +
      esc(l.work_location_name || 'Unnamed location') +
      (l.is_primary ? '<span class="uzio-chip">Primary</span>' : '') + '</div>' +
      '<div class="loc-row__addr">' + (street ? esc(street) + '<br>' : '') + esc(line2) + '</div></div>';
  }).join('') :
    '<p style="font-size:12.5px;color:var(--uzio-color-text-muted);margin:0">' +
    (r.fein ? 'No work locations recorded in prod for this FEIN.'
            : 'Not matched to a prod employer yet, so no locations are available.') + '</p>';

  panel('client-content').innerHTML =
    // No subtitle: short code, previous system and status all appear in the
    // Identity and Milestones cards immediately below.
    '<h1 class="uzio-page-title">' + esc(r.dsp_name) + '</h1>' +
    '<div class="detail-grid">' +
      '<div class="detail-card"><h3>Identity</h3>' +
        kv('DSP short code', esc(r.dsp_short_code)) +
        kv('FEIN', r.fein ? '<span class="tnum">' + esc(r.fein) + '</span>' : null) +
        // "Previous system" is the sheet's own field and is filled for 98 of 100
        // DSPs. The old inferred "Vendor" row was dropped from here: it came from
        // reading the Data Transfer (ADP)/(Paycom) note columns, which contradict
        // Previous System for 7 of the 37 clients that had both.
        kv('Previous system', sourceCell(r.previous_system)) +
        kv('State', r.state ? esc(r.state) : null) +
        kv('Pay frequency', r.frequency ? esc(r.frequency) : null) +
        kv('Implementor', r.implementor ? esc(r.implementor) : null) +
      '</div>' +
      '<div class="detail-card"><h3>Milestones</h3>' +
        kv('Expected TT live', fmtDate(r.expected_tt_live_date)) +
        kv('Actual TT live', fmtDate(r.actual_tt_live_date)) +
        kv('Payroll cut-off', fmtDate(r.payroll_cutoff_date)) +
        kv('Payroll live', fmtDate(r.payroll_live_date)) +
        kv('Final status', r.final_status ? esc(r.final_status) : null) +
      '</div>' +
      '<div class="detail-card"><h3>Work locations' +
        (locs.length ? ' (' + locs.length + ')' : '') + '</h3>' + locHtml + '</div>' +
    '</div>' +
    benefitsSection(r) +
    // Kept, but as a plain section rather than a callout — this is data lifted
    // out of the sheet's own cell, not an explanation of the page.
    (r.source_row_notes
      ? section('Notes from the source sheet',
          '<div class="detail-card"><div style="font-size:12.5px;color:var(--uzio-color-text-body);' +
          'line-height:1.6;white-space:pre-line">' + esc(r.source_row_notes) + '</div></div>')
      : '') +
    clientCoverageSection(r) +
    clientApiSection(r) +
    clientHistoricalSection(r) +
    clientAuditSection(r) +
    clientDocumentsSection(r) +
    clientOpenItemsSection(r);

  showView('client', r.dsp_name);
  loadClientTimeline(code);   // async: the section renders a placeholder first
}

/* Coverage + load history for one client, on its own page rather than expanded
   under the grid row — three metric cells and a chart inside a table row buried
   the numbers and pushed everything else down. Here the figures are written out
   as plain rows and the chart has room to breathe. */
function clientCoverageSection(client){
  const c = (DATA.coverage || []).find(x => x.dsp_short_code === client.dsp_short_code);
  // A client only gets a coverage row once prod holds employees for its FEIN --
  // the count comes from a join on employee, so an employer with none produces
  // no row at all. Saying "not counted yet" would blame the refresh for what is
  // really an empty employer.
  if(!c) return section('Data coverage',
    '<div class="detail-card">' + emptyNote(
      client.fein ? 'No employees in prod under this FEIN yet, so there is nothing to count.'
                  : 'Not matched to a prod employer, so there is nothing to count.') + '</div>');

  const pair = (label, have, den) => {
    if(!den) return kv(label, null);
    const pct = covPct(have, den), miss = den - have;
    return kv(label, '<span class="tnum">' + have.toLocaleString() + ' of ' + den.toLocaleString() +
      '</span> &middot; ' + pct + '%' +
      (miss > 0 ? ' <span style="color:var(--uzio-color-text-muted)">(' +
        miss.toLocaleString() + ' missing)</span>' : ''));
  };

  const a = c.active_employees || 0, t = c.total_employees || 0;
  const cards =
    '<div class="detail-card"><h3>Still on the books</h3>' +
      kv('Active employees', '<span class="tnum">' + a.toLocaleString() + '</span>') +
      pair('Payment method', c.active_with_payment_method || 0, a) +
      pair('Emergency contact', c.active_with_emergency_contact || 0, a) +
      pair('Driving licence', c.active_with_licence || 0, a) +
      pair('Worker comp', c.active_with_worker_comp || 0, a) +
      (c.worker_comp_codes ? kv('Codes assigned', esc(c.worker_comp_codes)) : '') +
    '</div>' +
    '<div class="detail-card"><h3>Everyone ever loaded</h3>' +
      kv('Total employees', '<span class="tnum">' + t.toLocaleString() + '</span>' +
        (t > a ? ' <span style="color:var(--uzio-color-text-muted)">(' +
          (t - a).toLocaleString() + ' terminated)</span>' : '')) +
      pair('Payment method', c.total_with_payment_method || 0, t) +
      pair('Emergency contact', c.total_with_emergency_contact || 0, t) +
      pair('Driving licence', c.total_with_licence || 0, t) +
      pair('Worker comp', c.total_with_worker_comp || 0, t) +
    '</div>' +
    '<div class="detail-card" id="cov-loadstats"><h3>Load history</h3>' +
      emptyNote('Loading…') + '</div>';

  return section('Data coverage',
    '<div class="detail-grid">' + cards + '</div>' +
    '<div class="detail-card"><h3>When employees arrived</h3>' +
      '<div id="cov-loadchart">' + emptyNote('Loading…') + '</div></div>',
    'counted from prod on ' + fmtDatePlain(c.checked_date));
}

/* The events are fetched per client rather than preloaded: PostgREST caps a
   response at 1000 rows and there are ~3,500 events, so one up-front fetch
   silently returned only the oldest third of them. */
function loadClientTimeline(code){
  const chart = document.getElementById('cov-loadchart');
  const stats = document.getElementById('cov-loadstats');
  if(!chart) return;
  const draw = (evs) => {
    if(!document.getElementById('cov-loadchart')) return;
    chart.innerHTML = covTimeline(evs);
    if(stats) stats.innerHTML = '<h3>Load history</h3>' + covLoadStats(evs, code);
  };
  if(DATA.loadEvents[code]) return draw(DATA.loadEvents[code]);
  sbGet('client_load_events?select=*&dsp_short_code=eq.' + encodeURIComponent(code) +
        '&order=event_date.asc')
    .then(evs => { DATA.loadEvents[code] = evs; draw(evs); })
    .catch(e => { chart.innerHTML = '<div class="err-box">' + esc(e.message) + '</div>'; });
}

/* The written-out version of what the bars show — the questions a single
   last_run_date cannot answer: when the bulk actually landed, who put it there,
   and how much arrived afterwards. */
function covLoadStats(evs, code){
  const added = evs.filter(e => e.kind === 'added')
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
  if(!added.length) return emptyNote('No load history recorded for this client.');

  const total = added.reduce((s, e) => s + (e.employees || 0), 0);
  const biggest = added.reduce((m, e) => (!m || e.employees > m.employees) ? e : m, null);
  let run = 0, half = null;
  added.forEach(e => { run += e.employees || 0; if(!half && total && run >= total / 2) half = e; });
  const byStaff = added.filter(e => e.actor_type === 'staff').reduce((s, e) => s + e.employees, 0);
  const left = evs.filter(e => e.kind === 'terminated').reduce((s, e) => s + (e.employees || 0), 0);
  const pct = (n) => covPct(n, total);   // shared so the no-false-100% rule applies here too

  return kv('First load', fmtDate(added[0].event_date) + ' &middot; ' +
      added[0].employees.toLocaleString() + ' by ' + esc(added[0].actor)) +
    kv('Biggest load', fmtDate(biggest.event_date) + ' &middot; ' +
      biggest.employees.toLocaleString() + ' (' + pct(biggest.employees) + '%) by ' + esc(biggest.actor)) +
    kv('Half were in by', fmtDate(half ? half.event_date : null)) +
    kv('Most recent', fmtDate(added[added.length - 1].event_date) + ' &middot; ' +
      added[added.length - 1].employees.toLocaleString() + ' by ' + esc(added[added.length - 1].actor)) +
    kv('Load events', added.length + ' on ' +
      new Set(added.map(e => e.event_date)).size + ' days') +
    kv('Added by Uzio staff', '<span class="tnum">' + byStaff.toLocaleString() + '</span> of ' +
      total.toLocaleString() + ' (' + pct(byStaff) + '%)') +
    // "1,000 total (791 terminated)" next to "0 left since first load" reads as
    // a contradiction until you know the census imports the client's whole
    // ADP/Paycom history — those 791 were already gone when they arrived.
    kv('Left since first load', (function(){
      const c = (DATA.coverage || []).find(x => x.dsp_short_code === code);
      const gone = c ? (c.total_employees || 0) - (c.active_employees || 0) : 0;
      const before = Math.max(0, gone - left);
      return '<span class="tnum">' + left.toLocaleString() + '</span>' +
        (before ? ' <span style="color:var(--uzio-color-text-muted)">(a further ' +
          before.toLocaleString() + ' were already terminated when imported)</span>' : '');
    })());
}

function emptyNote(msg){
  return '<p style="font-size:12.5px;color:var(--uzio-color-text-muted);margin:0">' + esc(msg) + '</p>';
}
function section(title, inner, meta){
  return '<div class="section-block"><h2>' + esc(title) +
    (meta ? '<span style="font-weight:400;font-size:12px;color:var(--uzio-color-text-faint)">' + esc(meta) + '</span>' : '') +
    '</h2>' + inner + '</div>';
}

/* Benefits, straight from the sheet and NOT reduced to a yes/no. The recorded
   value is usually the name of the platform the client went with (Decisely,
   Innovative BPS, Employee Navigator) — which is the actual answer to "are they
   using ours". Flattening that to a boolean would discard the useful half, so
   the value is shown verbatim with the running notes underneath. */
function benefitsSection(client){
  const req = client.benefits_requirement;
  const notes = client.benefits_details;
  const via = client.benefits_deductions_via;
  if(!req && !notes && !via){
    return section('Benefits', emptyNote('Nothing recorded against Benefits in the tracker for this client.'));
  }
  // Only call out the two unambiguous readings; everything else is left as-is
  // rather than guessed at.
  const t = (req || '').trim().toLowerCase();
  let tag = '';
  if(/^(no|none|no benefits?( as of now)?\.?)$/.test(t)) {
    tag = '<span class="uzio-status uzio-status--neutral">No benefits</span>';
  } else if(t.indexOf('uzio') !== -1) {
    tag = '<span class="uzio-status uzio-status--success">Uzio benefits</span>';
  } else if(t.indexOf('not using our platform') !== -1) {
    tag = '<span class="uzio-status uzio-status--warning">Not on our platform</span>';
  }

  // Build the value first: `null + ''` stringifies to "null" in JS and would
  // print literally in the cell.
  const reqVal = req ? esc(req) + (tag ? ' ' + tag : '') : null;

  return section('Benefits',
    '<div class="detail-card">' +
      kv('Recorded as', reqVal) +
      kv('Deductions / contributions', via ? esc(via).replace(/\n/g, ' · ') : null) +
      (notes
        ? '<div style="margin-top:12px">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;' +

// Joins on dsp_short_code — historical_scope keys off client_overview directly,
// so unlike the audit/document sections this needs no name matching.
function clientHistoricalSection(client){
  const sc = (DATA.histScope || []).find(s => s.dsp_short_code === client.dsp_short_code);
  if(!sc){
    const acc = accessOf(client.dsp_short_code);
    const dropped = (DATA.accessExcluded || {})[client.dsp_short_code];
    let why;
    if((client.previous_system || '').trim().toLowerCase() === 'new'){
      why = 'New to the platform — there is no previous system to pull historical data from.';
    } else if(dropped){
      // The exclusion is a human decision and outranks the spreadsheet, which
      // may well still say the credentials work.
      why = 'Dropped from the historical-data window on ' + esc(dropped.excluded_on) + '. ' +
            esc(dropped.reason);
    } else if(acc.row && acc.status === 'Has access'){
      // Worth saying plainly: the window has closed on this client but the
      // access sheet says we can still get in, so the data is still there for
      // the taking even though nothing here is tracking it.
      why = 'Not in the historical-data window — the last onboarding API run is more than 90 days ' +
            'old. The access sheet still lists working access, so this data could be collected.';
    } else if(acc.row){
      why = 'Not in the historical-data window. Platform access is recorded as "' +
            esc(acc.status) + '".';
    } else {
      why = 'Not in the historical-data window (a DSP is tracked for 90 days after its ' +
            'onboarding API runs, which is roughly how long ADP/Paycom access lasts).';
    }
    return section('Historical Data', emptyNote(why));
  }

  const catById = {};
  (DATA.histCatalog || []).forEach(c => { catById[c.id] = c; });

  const reports = {};
  (DATA.histStatus || [])
    .filter(s => s.dsp_short_code === client.dsp_short_code)
    .forEach(s => {
      const c = catById[s.report_id];
      if(!c) return;
      (reports[s.report_id] = reports[s.report_id] || { cat: c, units: [] }).units.push(s);
    });

  const list = Object.values(reports);
  list.forEach(r => r.units.sort((a, b) => a.unit_label.localeCompare(b.unit_label)));
  list.sort((a, b) => a.cat.sort_order - b.cat.sort_order);

  const all = list.reduce((n, r) => n + r.units.length, 0);
  const got = list.reduce((n, r) => n + r.units.filter(u => u.status === 'Received').length, 0);
  const pct = all ? got / all * 100 : 0;
  const fill = got === all && all ? '' : (pct >= 50 ? ' uzio-progress__fill--warn' : ' uzio-progress__fill--error');

  const body = groupByCategory(list).map(([cat, reps]) =>
    '<div class="hist-cat">' + esc(cat) + '</div>' +
    reps.map(r => reportRow(r, false)).join('')
  ).join('');

  const acc = accessOf(client.dsp_short_code);
  const accLine =
    '<div class="detail-access">' + accessChip(client.dsp_short_code) +
      '<span>' + (acc.row
        ? 'Platform access recorded as <b>' + esc(acc.status) + '</b> on ' + esc(acc.row.checked_on) +
          (acc.row.fdqot_in_file ? '. Qualified-overtime figure in the file: <b>' +
            esc(acc.row.fdqot_in_file) + '</b>' : '') +
          (acc.usable ? '.' : ' — anything still pending below cannot be collected.')
        : 'This client is not listed in the access spreadsheet, so whether ADP/Paycom can ' +
          'still be reached is unknown.') +
      '</span></div>';

  return section('Historical Data',
    '<div class="detail-card">' +
      accLine +
      '<div class="uzio-progress" style="margin-bottom:12px">' +
      '<div class="uzio-progress__fill' + fill + '" style="width:' + pct + '%"></div></div>' +
      body +
    '</div>',
    got + ' of ' + all + ' files · in scope since ' + sc.entered_on);
}

  search: { id: 'histSearch', placeholder: 'Search client…' },
  groups: [
    { id: 'histState', options: [
      { val: 'all', label: 'Any state' },
      { val: 'complete', label: 'Complete', dot: DOT.good },
      { val: 'partial', label: 'In progress', dot: DOT.warn },
      { val: 'none', label: 'Nothing yet', dot: DOT.bad }
    ]},
    { id: 'histVendor', options: [
      { val: 'all', label: 'Any source' },
      { val: 'ADP', label: 'ADP', dot: DOT.info },
      { val: 'Paycom', label: 'Paycom', dot: DOT.orange }
    ]},
    { id: 'histAccess', options: [
      { val: 'all', label: 'Any access' },
      { val: 'usable', label: 'Still reachable', dot: DOT.good },
      { val: 'blocked', label: 'Cannot log in', dot: DOT.bad }
    ]}
  ],
  toggles: [{ id: 'histPendingOnly', label: 'Only reports still pending' }],
  countId: 'histCount'
